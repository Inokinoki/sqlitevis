<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite - Fast SQL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 5px; }
        .status { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
        textarea { width: 100%; height: 150px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-family: 'SF Mono', Monaco, monospace; font-size: 13px; resize: vertical; }
        .btn-row { margin: 15px 0; }
        button { background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
        button:hover { background: #2ea043; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #30363d; }
        .btn-secondary:hover { background: #3c444d; }
        .output { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 15px; min-height: 100px; max-height: 500px; overflow: auto; }
        .placeholder { color: #8b949e; text-align: center; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background: #21262d; color: #58a6ff; text-align: left; padding: 8px; position: sticky; top: 0; border-bottom: 1px solid #30363d; }
        td { padding: 8px; border-bottom: 1px solid #21262d; }
        tr:hover { background: #161b22; }
        .timing { color: #3fb950; font-size: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SQLite Query Engine</h1>
        <p class="status" id="status">Ready - Instant load</p>

        <textarea id="sql" placeholder="Enter SQL...">CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER);
INSERT INTO users VALUES (1, 'Alice', 30);
INSERT INTO users VALUES (2, 'Bob', 25);
SELECT * FROM users;</textarea>

        <div class="btn-row">
            <button id="run">Run SQL</button>
            <button id="clear" class="btn-secondary">Clear</button>
        </div>

        <div class="output" id="output">
            <div class="placeholder">Results appear here</div>
        </div>
    </div>

    <script>
        let alasql = null;
        let loading = false;

        const runBtn = document.getElementById('run');
        const clearBtn = document.getElementById('clear');
        const output = document.getElementById('output');
        const status = document.getElementById('status');

        runBtn.addEventListener('click', async () => {
            const sql = document.getElementById('sql').value.trim();
            if (!sql) return;

            if (!alasql) {
                if (loading) return;
                loading = true;
                runBtn.disabled = true;
                runBtn.textContent = 'Loading engine...';
                status.textContent = 'Loading SQL engine (first time only)...';

                try {
                    await loadAlasql();
                } catch (e) {
                    output.innerHTML = `<div style="color:#f85149">Error: ${e.message}</div>`;
                    return;
                }
            }

            const start = performance.now();
            try {
                const results = alasql(sql);
                const time = (performance.now() - start).toFixed(2);
                showResults(results, time);
                status.textContent = `Done in ${time}ms`;
            } catch (e) {
                output.innerHTML = `<div style="color:#f85149">Error: ${e.message}</div>`;
                status.textContent = 'Error';
            }
        });

        clearBtn.addEventListener('click', () => {
            output.innerHTML = '<div class="placeholder">Results appear here</div>';
            status.textContent = 'Ready';
        });

        async function loadAlasql() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/alasql@4.17.0/dist/alasql.min.js';
                script.onload = () => {
                    alasql = window.alasql;
                    loading = false;
                    runBtn.disabled = false;
                    runBtn.textContent = 'Run SQL';
                    resolve();
                };
                script.onerror = () => {
                    loading = false;
                    runBtn.disabled = false;
                    runBtn.textContent = 'Run SQL';
                    reject(new Error('Failed to load engine'));
                };
                document.head.appendChild(script);
            });
        }

        function showResults(results, time) {
            if (!results || results.length === 0) {
                output.innerHTML = `<div class="timing">${time}ms · No results</div>`;
                return;
            }

            if (typeof results === 'number') {
                output.innerHTML = `<div class="timing">${time}ms · Affected rows: ${results}</div>`;
                return;
            }

            if (!Array.isArray(results)) {
                output.innerHTML = `<div class="timing">${time}ms · ${JSON.stringify(results)}</div>`;
                return;
            }

            const first = results[0];
            if (typeof first !== 'object' || first === null) {
                output.innerHTML = `<div class="timing">${time}ms · ${results.length} rows</div><pre>${JSON.stringify(results, null, 2)}</pre>`;
                return;
            }

            const cols = Object.keys(first);
            let html = `<div class="timing">${time}ms · ${results.length} rows</div><table><thead><tr>`;
            cols.forEach(c => html += `<th>${c}</th>`);
            html += '</tr></thead><tbody>';
            results.forEach(row => {
                html += '<tr>';
                cols.forEach(c => html += `<td>${row[c] === null ? '<span style="color:#8b949e">NULL</span>' : row[c]}</td>`);
                html += '</tr>';
            });
            html += '</tbody></table>';
            output.innerHTML = html;
        }
    </script>
</body>
</html>
