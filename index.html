<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=src/web/">
    <title>SQLite Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { font-size: 16px; opacity: 0.9; margin-bottom: 20px; }
        a {
            display: inline-block;
            padding: 12px 24px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        a:hover { transform: translateY(-2px); }
        .info {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 SQLite Web</h1>
        <p>Fast. Simple. Powerful.</p>
        <a href="src/web/">Enter SQLite Web</a>
        <div class="info">Redirecting automatically...</div>
    </div>
    <script>
        // Instant redirect for better UX
        window.location.href = 'src/web/';
    </script>
</body>
</html>
