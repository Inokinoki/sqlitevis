<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite B-Tree Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 5px; font-size: 24px; }
        .status { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; }
        .panel h2 { color: #58a6ff; font-size: 16px; margin-bottom: 10px; }
        textarea { width: 100%; height: 100px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 13px; resize: vertical; }
        .btn-row { margin: 10px 0; }
        button { background: #238636; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        button:hover { background: #2ea043; }
        .btn-sec { background: #30363d; }
        .btn-sec:hover { background: #3c444d; }
        .output { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px; min-height: 60px; max-height: 300px; overflow: auto; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th { background: #21262d; color: #58a6ff; padding: 5px; text-align: left; font-size: 11px; position: sticky; top: 0; }
        td { padding: 5px; border-bottom: 1px solid #30363d; font-size: 11px; }
        .time { color: #3fb950; font-size: 11px; margin-bottom: 5px; }
        #viz { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; height: 300px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SQLite B-Tree Visualization</h1>
        <p class="status" id="status">Ready - Zero dependencies</p>

        <div class="grid">
            <div class="panel">
                <h2>SQL Editor</h2>
                <textarea id="sql">SELECT * FROM users</textarea>
                <div class="btn-row">
                    <button onclick="run()">Run SQL</button>
                    <button onclick="clear()" class="btn-sec">Clear</button>
                </div>

                <h2>Results</h2>
                <div class="output" id="output">
                    <div style="color:#8b949e">Run SQL to see results</div>
                </div>
            </div>

            <div class="panel">
                <h2>B-Tree Visualization</h2>
                <div id="viz">
                    <div id="viz-content">B-Tree appears here after queries</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const db = { tables: {}, pages: {} };

        function run() {
            const sql = document.getElementById('sql').value.trim();
            const start = performance.now();

            try {
                const result = executeSQL(sql);
                const time = (performance.now() - start).toFixed(2);
                showResult(result, time);
                visualize(result);
                document.getElementById('status').textContent = `Done in ${time}ms`;
            } catch (e) {
                document.getElementById('output').innerHTML = `<div style="color:#f85149">${e.message}</div>`;
            }
        }

        function clear() {
            document.getElementById('output').innerHTML = '<div style="color:#8b949e">Run SQL to see results</div>';
            document.getElementById('viz-content').innerHTML = 'B-Tree appears here after queries';
            document.getElementById('status').textContent = 'Ready';
        }

        function executeSQL(sql) {
            const upper = sql.toUpperCase().trim();

            if (upper.startsWith('CREATE TABLE')) {
                const match = sql.match(/CREATE TABLE\s+(\w+)\s*\((.*)\)/i);
                if (!match) throw new Error('Invalid CREATE TABLE');
                const [, name, cols] = match;
                const columns = cols.split(',').map(c => c.trim().split(/\s+/)[0]);
                db.tables[name] = { columns, rows: [], rootPage: 1 };
                db.pages[1] = { type: 'leaf', entries: [] };
                return { affected: 0 };
            }

            if (upper.startsWith('INSERT')) {
                const match = sql.match(/INSERT INTO\s+(\w+)\s+VALUES\s*\((.*)\)/i);
                if (!match) throw new Error('Invalid INSERT');
                const [, name, vals] = match;
                const table = db.tables[name];
                if (!table) throw new Error(`Table ${name} not found`);
                const values = vals.split(',').map(v => v.trim());
                const row = {};
                table.columns.forEach((col, i) => row[col] = values[i] || null);
                table.rows.push(row);
                db.pages[table.rootPage].entries.push({ key: row[table.columns[0]], value: row });
                return { affected: 1 };
            }

            if (upper.startsWith('SELECT')) {
                const match = sql.match(/SELECT\s+(.+?)\s+FROM\s+(\w+)/i);
                if (!match) throw new Error('Invalid SELECT');
                const [, cols, name] = match;
                const table = db.tables[name];
                if (!table) throw new Error(`Table ${name} not found`);

                if (cols === '*') return table.rows;
                const columns = cols.split(',').map(c => c.trim());
                return table.rows.map(row => {
                    const r = {};
                    columns.forEach(col => r[col] = row[col]);
                    return r;
                });
            }

            throw new Error('Use: CREATE TABLE, INSERT, SELECT');
        }

        function showResult(result, time) {
            const out = document.getElementById('output');
            if (!result || result.length === 0) {
                out.innerHTML = `<div class="time">${time}ms · No results</div>`;
                return;
            }
            if (result.affected !== undefined) {
                out.innerHTML = `<div class="time">${time}ms · Affected: ${result.affected}</div>`;
                return;
            }
            const cols = Object.keys(result[0]);
            let html = `<div class="time">${time}ms · ${result.length} rows</div><table><tr>`;
            cols.forEach(c => html += `<th>${c}</th>`);
            html += '</tr>';
            result.forEach(row => {
                html += '<tr>';
                cols.forEach(c => html += `<td>${row[c] === null ? 'NULL' : row[c]}</td>`);
                html += '</tr>';
            });
            html += '</table>';
            out.innerHTML = html;
        }

        function visualize(result) {
            const viz = document.getElementById('viz-content');
            if (!result || result.length === 0 || result.affected !== undefined) {
                viz.innerHTML = 'No data to visualize';
                return;
            }

            // Simple B-Tree visualization
            let html = '<div style="width:100%;height:100%;padding:10px;overflow:auto;">';
            html += '<div style="color:#58a6ff;margin-bottom:10px;">B-Tree Structure</div>';
            html += '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">';

            const maxNodes = Math.min(result.length, 10);
            for (let i = 0; i < maxNodes; i++) {
                const row = result[i];
                const key = Object.values(row)[0];
                html += `
                    <div style="background:#21262d;border:1px solid #30363d;border-radius:6px;padding:10px;min-width:80px;text-align:center;">
                        <div style="color:#58a6ff;font-size:10px;margin-bottom:5px;">Leaf Node</div>
                        <div style="background:#0d1117;border-radius:4px;padding:5px;font-size:11px;font-family:monospace;">
                            ${key}
                        </div>
                        <div style="color:#8b949e;font-size:9px;margin-top:5px;">${Object.keys(row).length} cols</div>
                    </div>
                `;
            }

            if (result.length > 10) {
                html += `<div style="color:#8b949e;padding:10px;">+ ${result.length - 10} more</div>`;
            }

            html += '</div></div>';
            viz.innerHTML = html;
        }

        // Initialize
        (function init() {
            executeSQL('CREATE TABLE users (id, name, age)');
            executeSQL("INSERT INTO users VALUES (1, 'Alice', 30)");
            executeSQL("INSERT INTO users VALUES (2, 'Bob', 25)");
            executeSQL("INSERT INTO users VALUES (3, 'Charlie', 35)");
        })();
    </script>
</body>
</html>
