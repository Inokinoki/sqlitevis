<!doctype html><html><head><meta charset=utf-8><title>SQL</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font:12px system-ui;background:#0d1117;color:#c9d1d9;padding:10px}h1{color:#58a6ff;margin-bottom:10px}#q{width:100%;height:60px;background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:8px;font:12px monospace;margin-bottom:8px}button{background:#238636;color:#fff;border:0;padding:6px 12px;border-radius:4px;cursor:pointer;margin-right:4px}button:hover{background:#2ea043}#o{background:#161b22;border:1px solid #30363d;border-radius:4px;padding:8px;min-height:60px}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}th,td{padding:6px;border-bottom:1px solid #30363d;text-align:left}th{background:#21262d;color:#58a6ff}t{color:#3fb950;font-size:11px;margin-bottom:4px}</style></head><body><h1>SQL</h1><textarea id=q>SELECT 1+1</textarea><div><button onclick=r()>Run</button><button onclick=c()>Clear</button></div><div id=o><t>Ready</t></div><script>const D={};function r(){const q=document.getElementById('q').value.trim();if(!q)return;const t0=performance.now();try{const x=ex(q);const t=(performance.now()-t0).toFixed(2);sh(x,t)}catch(e){document.getElementById('o').innerHTML='<t style=color:#f85149>'+e.message+'</t>'}}function c(){document.getElementById('q').value='';document.getElementById('o').innerHTML='<t>Ready</t>'}function ex(s){const u=s.toUpperCase().trim();if(u.startsWith('CREATE')){const m=s.match(/CREATE\s+TABLE\s+(\w+)\s*\((.*)\)/i);if(!m)throw new Error('Invalid CREATE');const c=m[2].split(',').map(v=>v.trim());D[m[1]]={cols:c,rows:[]};return{}}if(u.startsWith('INSERT')){const m=s.match(/INSERT\s+INTO\s+(\w+)\s+VALUES\s*\((.*)\)/i);if(!m||!D[m[1]])throw new Error('Invalid INSERT');const v=m[2].split(',').map(x=>x.trim());const r={};D[m[1]].cols.forEach((c,i)=>r[c]=v[i]||null);D[m[1]].rows.push(r);return{}}if(u.startsWith('SELECT')){const m=s.match(/SELECT\s+(.+?)\s+FROM\s+(\w+)/i);if(!m||!D[m[2]])throw new Error('Invalid SELECT');const t=D[m[2]];const c=m[1].trim()=='*'?t.cols:m[1].trim().split(',').map(x=>x.trim());return t.rows.map(r=>c.map(x=>r[x]))}throw new Error('Use CREATE, INSERT, SELECT')}function sh(x,t){const o=document.getElementById('o');if(x.rows){let h='<t>'+x.rows.length+' rows ('+t+'ms)</t><table><tr>';x.rows[0].forEach((_,i)=>h+='<th>Col '+(i+1)+'</th>');h+='</tr>';x.rows.forEach(r=>{h+='<tr>';r.forEach(c=>h+='<td>'+(c===null?'<span style=color:#8b949e>NULL</span>':c)+'</td>');h+='</tr>'});h+='</table>';o.innerHTML=h}else{o.innerHTML='<t>Done ('+t+'ms)</t>}}ex('CREATE TABLE t(x,y)');ex("INSERT INTO t VALUES(1,'A')");ex("INSERT INTO t VALUES(2,'B')");</script></body></html>
