<!doctype html><html><head><meta charset=utf-8><title>S</title><style>*{margin:0;padding:0;font:12px sans-serif}body{padding:20px}#q{width:100%;height:80px;padding:8px;font:12px monospace;border:1px solid #ddd;margin-bottom:5px}button{padding:6px 12px;background:#007bff;color:#fff;border:0;border-radius:3px;cursor:pointer;font-size:12px}button:hover{background:#0056b3}#o{padding:8px;border:1px solid #ddd;min-height:40px;font:12px monospace;white-space:pre-wrap}table{border-collapse:collapse;margin-top:5px;font:12px}th,td{padding:6px;border-bottom:1px solid #ddd;text-align:left}th{background:#f0f0f0}.ok{color:#28a745}.err{color:#dc3545}</style></head><body><h1>SQL</h1><textarea id=q placeholder=SQL>CREATE TABLE t(x,y);
INSERT INTO t VALUES(1,'A');
INSERT INTO t VALUES(2,'B');
SELECT * FROM t;</textarea><button onclick=r()>Run</button><button onclick=c()>Clear</button><div id=o></div><script>const D={},T0=performance.now();function pv(v){v=v.trim();if(v==='NULL')return null;if(v.startsWith("'"))return v.slice(1,-1);if(v.startsWith('"'))return v.slice(1,-1);const n=Number(v);return isNaN(n)?v:n}function ct(sql){const m=sql.match(/CREATE\s+TABLE\s+(\w+)\s*\((.*)\)/i);if(!m)return{err:'Invalid CREATE'};D[m[1]]={cols:m[2].split(',').map(c=>({name:c.trim(),type:'TEXT'})),rows:[]};return{ok:true}}function ir(sql){const m=sql.match(/INSERT\s+INTO\s+(\w+)\s+VALUES\s*\((.*)\)/i);if(!m||!D[m[1]])return{err:'Invalid INSERT'};D[m[1]].rows.push(m[2].split(',').map(pv));return{ok:true}}function sl(sql){const m=sql.match(/SELECT\s+(.*?)\s+FROM\s+(\w+)/i);if(!m||!D[m[2]])return{err:'Invalid SELECT'};const t=D[m[2]],r=[...t.rows],c=m[1].trim();const h=c==='*'?t.cols.map(c=>c.name):c.split(',');if(c!=='*')r.forEach((x,i)=>{r[i]=h.map(c=>x[t.cols.findIndex(y=>y.name===c.trim())])});return{ok:true,rows:r,headers:h}}function r(){const q=document.getElementById('q').value.trim();if(!q)return;const t0=performance.now();const x=sl(q);if(x.err){document.getElementById('o').innerHTML='<div class=err>'+x.err+'</div>'}else if(x.rows){let h='<div class=ok>'+x.rows.length+' rows ('+((performance.now()-t0).toFixed(2)+'ms)</div><table><tr>';x.headers.forEach(h=>h+='<th>'+h+'</th>');h+='</tr>';x.rows.forEach(r=>{h+='<tr>';r.forEach(c=>h+='<td>'+(c==null?'NULL':c)+'</td>');h+='</tr>';});h+='</table>';document.getElementById('o').innerHTML=h;}else{document.getElementById('o').innerHTML='<div class=ok>Done</div>'}}function c(){document.getElementById('q').value='';document.getElementById('o').innerHTML=''}console.log('Ready',((performance.now()-T0).toFixed(2)+'ms');</script></body></html>
