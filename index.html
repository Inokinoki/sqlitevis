<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL - Instant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 10px; font-size: 24px; }
        .status { color: #8b949e; font-size: 13px; margin-bottom: 15px; }
        textarea { width: 100%; height: 120px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 13px; }
        .btn-row { margin: 10px 0; }
        button { background: #238636; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        button:hover { background: #2ea043; }
        .btn-sec { background: #30363d; }
        .btn-sec:hover { background: #3c444d; }
        .output { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; min-height: 80px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th { background: #21262d; color: #58a6ff; padding: 6px; text-align: left; font-size: 12px; }
        td { padding: 6px; border-bottom: 1px solid #30363d; font-size: 12px; }
        .time { color: #3fb950; font-size: 11px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SQL Query Runner</h1>
        <p class="status" id="status">Ready - Zero dependencies</p>
        <textarea id="sql" placeholder="SQL...">SELECT * FROM users</textarea>
        <div class="btn-row">
            <button onclick="run()">Run</button>
            <button onclick="clear()" class="btn-sec">Clear</button>
        </div>
        <div class="output" id="output">
            <div style="color:#8b949e">Results appear here</div>
        </div>
    </div>

    <script>
        // In-memory database - ZERO external dependencies
        const db = { tables: {} };

        function run() {
            const sql = document.getElementById('sql').value.trim();
            const start = performance.now();

            try {
                const result = executeSQL(sql);
                const time = (performance.now() - start).toFixed(2);
                showResult(result, time);
                document.getElementById('status').textContent = `Done in ${time}ms`;
            } catch (e) {
                document.getElementById('output').innerHTML = `<div style="color:#f85149">${e.message}</div>`;
            }
        }

        function clear() {
            document.getElementById('output').innerHTML = '<div style="color:#8b949e">Results appear here</div>';
            document.getElementById('status').textContent = 'Ready';
        }

        function executeSQL(sql) {
            // Simple SQL parser - handles basic queries
            const upper = sql.toUpperCase().trim();

            // CREATE TABLE
            if (upper.startsWith('CREATE TABLE')) {
                const match = sql.match(/CREATE TABLE\s+(\w+)\s*\((.*)\)/i);
                if (!match) throw new Error('Invalid CREATE TABLE syntax');
                const [, name, cols] = match;
                const columns = cols.split(',').map(c => c.trim().split(/\s+/)[0]);
                db.tables[name] = { columns, rows: [] };
                return { affected: 0 };
            }

            // INSERT
            if (upper.startsWith('INSERT')) {
                const match = sql.match(/INSERT INTO\s+(\w+)\s+VALUES\s*\((.*)\)/i);
                if (!match) throw new Error('Invalid INSERT syntax');
                const [, name, vals] = match;
                const table = db.tables[name];
                if (!table) throw new Error(`Table ${name} not found`);
                const values = vals.split(',').map(v => v.trim());
                const row = {};
                table.columns.forEach((col, i) => {
                    row[col] = values[i] || null;
                });
                table.rows.push(row);
                return { affected: 1 };
            }

            // SELECT
            if (upper.startsWith('SELECT')) {
                const match = sql.match(/SELECT\s+(.+?)\s+FROM\s+(\w+)/i);
                if (!match) throw new Error('Invalid SELECT syntax');
                const [, cols, name] = match;
                const table = db.tables[name];
                if (!table) throw new Error(`Table ${name} not found`);

                if (cols === '*') {
                    return table.rows;
                }
                const columns = cols.split(',').map(c => c.trim());
                return table.rows.map(row => {
                    const r = {};
                    columns.forEach(col => r[col] = row[col]);
                    return r;
                });
            }

            throw new Error('Unsupported SQL. Use: CREATE TABLE, INSERT, SELECT');
        }

        function showResult(result, time) {
            const out = document.getElementById('output');
            if (!result || result.length === 0) {
                out.innerHTML = `<div class="time">${time}ms · No results</div>`;
                return;
            }
            if (result.affected !== undefined) {
                out.innerHTML = `<div class="time">${time}ms · Affected: ${result.affected}</div>`;
                return;
            }
            const cols = Object.keys(result[0]);
            let html = `<div class="time">${time}ms · ${result.length} rows</div><table><tr>`;
            cols.forEach(c => html += `<th>${c}</th>`);
            html += '</tr>';
            result.forEach(row => {
                html += '<tr>';
                cols.forEach(c => html += `<td>${row[c] === null ? 'NULL' : row[c]}</td>`);
                html += '</tr>';
            });
            html += '</table>';
            out.innerHTML = html;
        }

        // Initialize with sample data
        (function init() {
            executeSQL('CREATE TABLE users (id, name, age)');
            executeSQL("INSERT INTO users VALUES (1, 'Alice', 30)");
            executeSQL("INSERT INTO users VALUES (2, 'Bob', 25)");
        })();
    </script>
</body>
</html>
