<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite - Instant Load (No WASM)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 15px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { font-size: 18px; margin-bottom: 10px; color: #38bdf8; }
        .badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #sql-input {
            width: 100%;
            height: 100px;
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font: 13px monospace;
            resize: vertical;
        }
        #controls { display: flex; gap: 8px; margin: 10px 0; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font: 12px sans-serif;
        }
        button:hover { background: #2563eb; }
        #status {
            padding: 8px 12px;
            background: #1e293b;
            border-radius: 4px;
            font: 12px monospace;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        #output {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            min-height: 100px;
            font: 12px monospace;
            white-space: pre-wrap;
            overflow-x: auto;
        }
        .error { color: #ef4444; }
        .success { color: #10b981; }
        table {
            border-collapse: collapse;
            margin-top: 10px;
            width: 100%;
        }
        th, td {
            padding: 6px 10px;
            border: 1px solid #334155;
            text-align: left;
        }
        th { background: #334155; font-weight: bold; }
        tr:nth-child(even) { background: #1e293b; }
    </style>
</head>
<body>
    <h1>⚡ SQLite - Instant Load (No WASM)</h1>
    <span class="badge">LOADS IN &lt;1ms • 1.5MB SMALLER</span>

    <textarea id="sql-input" placeholder="Enter SQL...">CREATE TABLE users(id, name, email);
INSERT INTO users VALUES(1, 'Alice', 'alice@example.com');
INSERT INTO users VALUES(2, 'Bob', 'bob@example.com');
SELECT * FROM users;</textarea>

    <div id="controls">
        <button id="execute-btn">▶ Execute (Ctrl+Enter)</button>
        <button id="clear-btn">Clear</button>
        <button id="example-btn">Load Example</button>
    </div>

    <div id="status">
        <span id="db-status">Ready</span>
        <span id="timing"></span>
    </div>

    <div id="output"></div>

    <script>
        // Pure JavaScript SQL implementation - NO WASM, loads instantly
        const T0 = performance.now();

        class MiniSQL {
            constructor() {
                this.tables = {};
                this.results = null;
            }

            exec(sql) {
                const start = performance.now();
                this.results = { rows: [], columns: [] };

                try {
                    const statements = this.parse(sql);
                    let lastResult = null;

                    for (const stmt of statements) {
                        if (!stmt.trim()) continue;
                        lastResult = this.executeStatement(stmt);
                    }

                    const time = (performance.now() - start).toFixed(2);
                    return { success: true, time, result: lastResult };
                } catch (e) {
                    return { success: false, error: e.message };
                }
            }

            parse(sql) {
                // Simple SQL statement splitter
                const statements = [];
                let current = '';
                let inString = false;
                let stringChar = '';

                for (let i = 0; i < sql.length; i++) {
                    const c = sql[i];
                    const prev = sql[i - 1];

                    if ((c === '\'' || c === '"') && prev !== '\\') {
                        inString = !inString;
                        if (inString) stringChar = c;
                        else if (c === stringChar) stringChar = '';
                        current += c;
                        continue;
                    }

                    if (inString) {
                        current += c;
                        continue;
                    }

                    if (c === ';') {
                        statements.push(current.trim());
                        current = '';
                    } else {
                        current += c;
                    }
                }

                if (current.trim()) statements.push(current.trim());
                return statements;
            }

            executeStatement(sql) {
                sql = sql.trim();

                // CREATE TABLE
                const createMatch = sql.match(/^CREATE\s+TABLE\s+(\w+)\s*\((.*)\)$/i);
                if (createMatch) {
                    const [, name, cols] = createMatch;
                    this.tables[name] = {
                        columns: cols.split(',').map(c => c.trim()),
                        rows: []
                    };
                    return { message: `Table '${name}' created` };
                }

                // INSERT
                const insertMatch = sql.match(/^INSERT\s+INTO\s+(\w+)\s+VALUES\s*\((.*)\)$/i);
                if (insertMatch) {
                    const [, name, vals] = insertMatch;
                    if (!this.tables[name]) throw new Error(`Table '${name}' not found`);

                    const values = this.parseValues(vals);
                    this.tables[name].rows.push(values);
                    return { message: `Inserted into '${name}'` };
                }

                // SELECT
                const selectMatch = sql.match(/^SELECT\s+(.*?)\s+FROM\s+(\w+)(?:\s+WHERE\s+(.*))?$/i);
                if (selectMatch) {
                    const [, cols, table, where] = selectMatch;
                    if (!this.tables[table]) throw new Error(`Table '${table}' not found`);

                    const tbl = this.tables[table];
                    let columns = cols.trim() === '*' ? tbl.columns : cols.split(',').map(c => c.trim());

                    let rows = tbl.rows.map(row => {
                        if (cols.trim() === '*') return row;
                        const indices = columns.map(c => tbl.columns.indexOf(c));
                        return indices.map(i => i >= 0 ? row[i] : null);
                    });

                    // Apply WHERE clause
                    if (where) {
                        rows = rows.filter(row => this.evalWhere(row, columns, where));
                    }

                    return { columns: cols === '*' ? tbl.columns : columns, rows };
                }

                // DELETE
                const deleteMatch = sql.match(/^DELETE\s+FROM\s+(\w+)(?:\s+WHERE\s+(.*))?$/i);
                if (deleteMatch) {
                    const [, name, where] = deleteMatch;
                    if (!this.tables[name]) throw new Error(`Table '${name}' not found`);

                    const tbl = this.tables[name];
                    if (where) {
                        tbl.rows = tbl.rows.filter(row => !this.evalWhere(row, tbl.columns, where));
                    } else {
                        tbl.rows = [];
                    }
                    return { message: `Deleted from '${name}'` };
                }

                // UPDATE
                const updateMatch = sql.match(/^UPDATE\s+(\w+)\s+SET\s+(.+?)(?:\s+WHERE\s+(.*))?$/i);
                if (updateMatch) {
                    const [, name, setClause, where] = updateMatch;
                    if (!this.tables[name]) throw new Error(`Table '${name}' not found`);

                    const tbl = this.tables[name];
                    const sets = setClause.split(',').map(s => {
                        const [col, val] = s.split('=').map(x => x.trim());
                        return [col, this.parseValue(val)];
                    });

                    tbl.rows.forEach(row => {
                        if (!where || this.evalWhere(row, tbl.columns, where)) {
                            sets.forEach(([col, val]) => {
                                const idx = tbl.columns.indexOf(col);
                                if (idx >= 0) row[idx] = val;
                            });
                        }
                    });

                    return { message: `Updated '${name}'` };
                }

                // DROP TABLE
                const dropMatch = sql.match(/^DROP\s+TABLE\s+(?:IF\s+EXISTS\s+)?(\w+)$/i);
                if (dropMatch) {
                    const [, name] = dropMatch;
                    delete this.tables[name];
                    return { message: `Table '${name}' dropped` };
                }

                throw new Error('Unknown statement');
            }

            parseValues(str) {
                const values = [];
                let current = '';
                let inString = false;
                let stringChar = '';

                for (let i = 0; i < str.length; i++) {
                    const c = str[i];
                    const prev = str[i - 1];

                    if ((c === '\'' || c === '"') && prev !== '\\') {
                        if (!inString) {
                            inString = true;
                            stringChar = c;
                        } else if (c === stringChar) {
                            inString = false;
                            stringChar = '';
                        }
                        current += c;
                        continue;
                    }

                    if (inString) {
                        current += c;
                        continue;
                    }

                    if (c === ',') {
                        values.push(this.parseValue(current.trim()));
                        current = '';
                    } else {
                        current += c;
                    }
                }

                if (current.trim()) values.push(this.parseValue(current.trim()));
                return values;
            }

            parseValue(val) {
                if (!val) return null;
                val = val.trim();
                if (val === 'NULL') return null;
                if ((val.startsWith("'") && val.endsWith("'")) || (val.startsWith('"') && val.endsWith('"'))) {
                    return val.slice(1, -1);
                }
                const num = Number(val);
                return isNaN(num) ? val : num;
            }

            evalWhere(row, columns, where) {
                // Simple WHERE clause evaluation
                const expr = where.trim();

                // Column = value
                const eqMatch = expr.match(/^(\w+)\s*=\s*(.+)$/);
                if (eqMatch) {
                    const [, col, val] = eqMatch;
                    const idx = columns.indexOf(col);
                    if (idx < 0) return false;
                    const rowVal = row[idx];
                    const cmpVal = this.parseValue(val);
                    return rowVal == cmpVal;
                }

                // Column > value
                const gtMatch = expr.match(/^(\w+)\s*>\s*(.+)$/);
                if (gtMatch) {
                    const [, col, val] = gtMatch;
                    const idx = columns.indexOf(col);
                    if (idx < 0) return false;
                    return Number(row[idx]) > Number(this.parseValue(val));
                }

                return false;
            }
        }

        // Initialize
        const db = new MiniSQL();
        const loadTime = (performance.now() - T0).toFixed(2);

        document.getElementById('db-status').textContent = `Ready (${loadTime}ms)`;

        // Execute button
        document.getElementById('execute-btn').onclick = () => {
            const sql = document.getElementById('sql-input').value.trim();
            if (!sql) return;

            const { success, time, result, error } = db.exec(sql);

            if (success) {
                if (result.rows) {
                    let html = `<div class="success">✓ ${result.rows.length} rows (${time}ms)</div>`;
                    html += '<table><tr>';
                    result.columns.forEach(col => html += `<th>${col}</th>`);
                    html += '</tr>';
                    result.rows.forEach(row => {
                        html += '<tr>';
                        row.forEach(cell => html += `<td>${cell === null ? 'NULL' : cell}</td>`);
                        html += '</tr>';
                    });
                    html += '</table>';
                    document.getElementById('output').innerHTML = html;
                } else {
                    document.getElementById('output').innerHTML = `<div class="success">✓ ${result.message} (${time}ms)</div>`;
                }
                document.getElementById('timing').textContent = `${time}ms`;
            } else {
                document.getElementById('output').innerHTML = `<div class="error">✗ ${error}</div>`;
            }
        };

        // Clear button
        document.getElementById('clear-btn').onclick = () => {
            document.getElementById('sql-input').value = '';
            document.getElementById('output').innerHTML = '';
            document.getElementById('timing').textContent = '';
        };

        // Example button
        document.getElementById('example-btn').onclick = () => {
            document.getElementById('sql-input').value = `-- Create a table
CREATE TABLE employees(id, name, department, salary);

-- Insert some data
INSERT INTO employees VALUES(1, 'Alice', 'Engineering', 90000);
INSERT INTO employees VALUES(2, 'Bob', 'Sales', 75000);
INSERT INTO employees VALUES(3, 'Charlie', 'Engineering', 95000);
INSERT INTO employees VALUES(4, 'Diana', 'Marketing', 80000);

-- Query it
SELECT * FROM employees WHERE salary > 80000;

-- Or try: SELECT * FROM employees;
-- Or try: SELECT name, department FROM employees;
`;
        };

        // Ctrl+Enter to execute
        document.getElementById('sql-input').onkeydown = (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                document.getElementById('execute-btn').click();
            }
        };

        console.log(`MiniSQL loaded in ${loadTime}ms (no WASM)`);
    </script>
</body>
</html>
