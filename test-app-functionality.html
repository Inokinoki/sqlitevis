<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test App Functionality</title>
    <script src="https://cdn.jsdelivr.net/npm/alasql@4.17.0/dist/alasql.min.js"></script>
    <script src="src/web/js/events.js"></script>
    <script src="src/web/js/visualizer.js"></script>
</head>
<body>
    <h1>Component Test</h1>
    <div id="log"></div>

    <script>
        const log = document.getElementById('log');

        function assert(condition, message) {
            const status = condition ? '✓ PASS' : '✗ FAIL';
            log.innerHTML += `<div>${status}: ${message}</div>`;
            console.assert(condition, message);
        }

        // Test 1: alasql loaded
        assert(typeof alasql !== 'undefined', 'alasql is loaded');

        // Test 2: alasql works
        try {
            alasql('CREATE TABLE test (id INT, name TEXT);');
            alasql("INSERT INTO test VALUES (1, 'test');");
            const result = alasql('SELECT * FROM test;');
            assert(Array.isArray(result) && result.length === 1, 'alasql executes queries');
        } catch (e) {
            assert(false, 'alasql executes queries: ' + e.message);
        }

        // Test 3: EventManager loaded
        assert(typeof EventManager !== 'undefined', 'EventManager class is defined');
        assert(typeof eventManager !== 'undefined', 'eventManager global instance exists');

        // Test 4: BTreeVisualizer loaded
        assert(typeof BTreeVisualizer !== 'undefined', 'BTreeVisualizer class is defined');

        // Test 5: FastSQLiteApp can be instantiated
        try {
            class FastSQLiteApp {
                constructor() {
                    this.visualizer = null;
                    this.eventManager = null;
                }

                init() {
                    if (typeof BTreeVisualizer !== 'undefined') {
                        this.visualizer = new BTreeVisualizer('test-canvas');
                    }
                    if (typeof eventManager !== 'undefined') {
                        this.eventManager = eventManager;
                    }
                }
            }

            const app = new FastSQLiteApp();
            app.init();
            assert(app.visualizer !== null, 'FastSQLiteApp creates visualizer');
            assert(app.eventManager !== null, 'FastSQLiteApp connects to eventManager');
        } catch (e) {
            assert(false, 'FastSQLiteApp instantiation: ' + e.message);
        }

        log.innerHTML += '<div style="color: green; font-weight: bold; margin-top: 20px;">All critical components loaded successfully!</div>';
    </script>
</body>
</html>
