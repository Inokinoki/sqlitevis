<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite SQL Runner - Fast Mode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { margin-bottom: 10px; }
        textarea {
            width: 100%;
            height: 150px;
            background: #0a0a0a;
            color: #00ff00;
            border: 1px solid #333;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .button-row { margin-bottom: 20px; }
        button {
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover { background: #00ff00; color: #000; }
        #output {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 10px;
            min-height: 200px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SQLite SQL Runner</h1>
        <textarea id="sql-input" placeholder="Enter SQL here...
CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT);
INSERT INTO users VALUES (1, 'Alice');
SELECT * FROM users;"></textarea>
        <div class="button-row">
            <button onclick="executeSQL()">Execute (Ctrl+Enter)</button>
            <button onclick="clearSQL()">Clear</button>
        </div>
        <div id="output">Ready. Enter SQL above and press Execute.</div>
        <div id="status"></div>
    </div>

    <script src="build/sqlite3.js"></script>
    <script>
        let db = null;
        let sqliteModule = null;

        function log(msg, type = 'info') {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '[ERROR]' : type === 'success' ? '[SUCCESS]' : '[INFO]';
            output.innerHTML += `\n${timestamp} ${prefix} ${msg}`;
            output.scrollTop = output.scrollHeight;
        }

        function setStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        async function initSQLite() {
            try {
                setStatus('Loading SQLite WASM...');
                if (typeof createSQLiteModule === 'undefined') {
                    throw new Error('SQLite WASM not found. Run: make build-wasm');
                }

                sqliteModule = await createSQLiteModule();
                log('SQLite WASM loaded', 'success');

                const dbPath = ':memory:';
                const dbPathLen = sqliteModule.lengthBytesUTF8(dbPath) + 1;
                const dbPathPtr = sqliteModule._malloc(dbPathLen);
                sqliteModule.stringToUTF8(dbPath, dbPathPtr, dbPathLen);

                const dbPtrPtr = sqliteModule._malloc(4);
                const result = sqliteModule._sqlite3_open(dbPathPtr, dbPtrPtr);

                if (result !== 0) {
                    throw new Error('Failed to open database');
                }

                db = sqliteModule.HEAP32[dbPtrPtr >> 2];
                sqliteModule._free(dbPathPtr);
                sqliteModule._free(dbPtrPtr);

                log('Database ready (in-memory)', 'success');
                setStatus('Ready');
            } catch (error) {
                log('Error: ' + error.message, 'error');
                setStatus('Error');
            }
        }

        function executeSQL() {
            const sql = document.getElementById('sql-input').value.trim();
            if (!sql) {
                log('Please enter SQL', 'error');
                return;
            }

            if (!db || !sqliteModule) {
                log('Database not initialized', 'error');
                return;
            }

            log('Executing: ' + sql.substring(0, 100) + (sql.length > 100 ? '...' : ''));

            try {
                const sqlLen = sqliteModule.lengthBytesUTF8(sql) + 1;
                const sqlPtr = sqliteModule._malloc(sqlLen);
                sqliteModule.stringToUTF8(sql, sqlPtr, sqlLen);

                const errorPtrPtr = sqliteModule._malloc(4);
                sqliteModule.HEAP32[errorPtrPtr >> 2] = 0;

                const result = sqliteModule._sqlite3_exec(db, sqlPtr, 0, 0, errorPtrPtr);

                sqliteModule._free(sqlPtr);

                if (result !== 0) {
                    const errorMsgPtr = sqliteModule.HEAP32[errorPtrPtr >> 2];
                    if (errorMsgPtr) {
                        const errorMsg = sqliteModule.UTF8ToString(errorMsgPtr);
                        log('SQL Error: ' + errorMsg, 'error');
                    }
                } else {
                    log('Query executed successfully', 'success');
                }

                sqliteModule._free(errorPtrPtr);
            } catch (error) {
                log('Error: ' + error.message, 'error');
            }
        }

        function clearSQL() {
            document.getElementById('sql-input').value = '';
            log('--- Cleared ---');
        }

        // Keyboard shortcut
        document.getElementById('sql-input').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                executeSQL();
            }
        });

        // Initialize
        initSQLite();
    </script>
</body>
</html>
