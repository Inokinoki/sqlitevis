<!DOCTYPE html><html><head><meta charset="UTF-8"><title>SQLite</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font:12px system-ui;background:#f5f5f5;padding:10px;max-width:600px;margin:0 auto}textarea{width:100%;height:80px;font:11px monospace;padding:5px;border:1px solid #ddd;background:#fff;margin-bottom:5px}button{padding:5px 10px;border:none;background:#2563eb;color:#fff;cursor:pointer;margin-right:5px;font:12px system-ui}#out{padding:5px;background:#fff;border:1px solid #ddd;min-height:30px;margin-top:5px;font:11px monospace}.err{color:#ef4444}.ok{color:#10b981}</style></head><body><textarea id=sql spellcheck=false>CREATE TABLE test(id INTEGER PRIMARY KEY, name TEXT);
INSERT INTO test VALUES(1, 'Alice');
SELECT * FROM test;</textarea><div><button onclick=run()>Execute</button><button onclick=clr()>Clear</button></div><div id=out>Loading...</div><script>
let db,mod;
async function init(){
  while(typeof createSQLiteModule==='undefined')await new Promise(r=>setTimeout(r,50));
  mod=await createSQLiteModule();
  const p=mod._malloc(mod.lengthBytesUTF8(':memory:')+1);
  mod.stringToUTF8(':memory:',p,mod.lengthBytesUTF8(':memory:')+1);
  const pp=mod._malloc(4);
  mod._sqlite3_open(p,pp);
  db=mod.HEAP32[pp>>2];
  mod._free(p);mod._free(pp);
  document.getElementById('out').innerText='Ready';
}
function run(){
  const sql=document.getElementById('sql').value.trim();
  if(!sql)return document.getElementById('out').innerText='Enter SQL',document.getElementById('out').className='err';
  const sp=mod._malloc(mod.lengthBytesUTF8(sql)+1);
  mod.stringToUTF8(sql,sp,mod.lengthBytesUTF8(sql)+1);
  const ep=mod._malloc(4);
  const rc=mod._sqlite3_exec(db,sp,0,0,ep);
  mod._free(sp);
  if(rc){
    const em=mod.HEAP32[ep>>2];
    document.getElementById('out').innerText=em?mod.UTF8ToString(em):'Error '+rc;
    document.getElementById('out').className='err';
  }else{
    document.getElementById('out').innerText='✓ OK';
    document.getElementById('out').className='ok';
  }
  mod._free(ep);
}
function clr(){document.getElementById('sql').value='';document.getElementById('out').innerText='';}
init();
</script></body></html>
