<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SQLite Debug</title>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{font:12px system-ui;background:#f5f5f5;padding:15px;max-width:700px;margin:0 auto}#c{background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}h1{color:#2563eb;margin-bottom:10px}#q{width:100%;height:100px;padding:10px;border:1px solid #dee2e6;background:#fff;border-radius:4px;font-family:monospace;font-size:13px;margin-bottom:10px;resize:vertical}.b button{padding:8px 16px;border:none;background:#2563eb;color:#fff;border-radius:4px;cursor:pointer;font-size:13px;margin-right:6px}button:hover{background:#1d4ed8}button:disabled{background:#adb5bd;cursor:not-allowed}#d{background:#fff;border:1px solid #dee2e6;padding:10px;border-radius:4px;margin-top:10px;font-family:monospace;font-size:11px;white-space:pre-wrap;max-height:200px;overflow:auto}.ok{color:#198754}.err{color:#dc3545}</style>
</head>
<body>
<div id=c>
  <h1>SQLite (Debug Mode)</h1>
  <textarea id=q spellcheck="false">SELECT 1 as test;</textarea>
  <div class=b><button id=r onclick=r()>Run</button></div>
  <div id=d>Initializing...</div>
</div>

<script>
const DEBUG = true;
const log = (...msg) => {
  if (DEBUG) {
    console.log('[SQL Debug]', ...msg);
    const d = document.getElementById('d');
    d.textContent += msg.join(' ') + '\n';
    d.scrollTop = d.scrollHeight;
  }
};

log('Page loaded');
log('Waiting for SQLite module...');

let db = null;
let mod = null;
let ready = false;

const startTime = Date.now();

log('Starting module load...');

(function() {
  const scriptStart = Date.now();
  const s = document.createElement('script');
  s.src = 'build/sqlite3.js';
  s.async = true;
  s.onload = () => {
    log('Script onload fired, took:', Date.now() - scriptStart + 'ms');
    try {
      init();
    } catch(e) {
      log('Init error:', e.message);
      document.getElementById('d').innerHTML = '<div class=err>Error: ' + e.message + '</div>';
    }
  };
  s.onerror = (e) => {
    log('Script onerror:', e);
    document.getElementById('d').innerHTML = '<div class=err>Failed to load sqlite3.js</div>';
  };
  document.head.appendChild(s);
  log('Script tag appended');
})();

async function init() {
  log('init() called');
  log('createSQLiteModule exists:', typeof createSQLiteModule);

  if (typeof createSQLiteModule === 'undefined') {
    document.getElementById('d').innerHTML = '<div class=err>Error: SQLite module not found after load</div>';
    return;
  }

  log('Calling createSQLiteModule()...');
  const moduleStart = Date.now();

  try {
    mod = await createSQLiteModule();
    log('Module loaded, took:', Date.now() - moduleStart + 'ms');
    log('Module object:', mod ? 'exists' : 'NULL');

    if (!mod) {
      throw new Error('Module is null/undefined');
    }

    log('Allocating memory...');
    const p = mod._malloc(mod.lengthBytesUTF8(':memory:') + 1);
    mod.stringToUTF8(':memory:', p, mod.lengthBytesUTF8(':memory:') + 1);

    const pp = mod._malloc(4);
    log('Calling sqlite3_open...');

    const rc = mod._sqlite3_open(p, pp);
    log('sqlite3_open returned:', rc);

    if (rc !== 0) {
      mod._free(p);
      mod._free(pp);
      throw new Error('sqlite3_open failed with code: ' + rc);
    }

    db = mod.HEAP32[pp >> 2];
    log('Database handle:', db);

    mod._free(p);
    mod._free(pp);

    ready = true;
    const totalTime = ((Date.now() - startTime) / 1000).toFixed(2);

    log('Ready! Total time:', totalTime + 's');
    document.getElementById('d').innerHTML = '<div class=ok>✓ Ready in ' + totalTime + 's</div>';
    document.getElementById('r').disabled = false;

  } catch (error) {
    log('ERROR:', error.message, error.stack);
    document.getElementById('d').innerHTML = '<div class=err>Error: ' + error.message + '</div>';
  }
}

function r() {
  log('Run button clicked, ready:', ready);

  if (!ready) {
    log('Not ready yet, please wait...');
    return;
  }

  const sql = document.getElementById('q').value.trim();
  log('Executing SQL:', sql.substring(0, 50));

  const execStart = Date.now();

  try {
    const sp = mod._malloc(mod.lengthBytesUTF8(sql) + 1);
    mod.stringToUTF8(sql, sp, mod.lengthBytesUTF8(sql) + 1);

    const res = [];
    const cb = mod.addFunction((n, cols, vals) => {
      const row = [];
      for (let i = 0; i < cols; i++) {
        const vp = HEAP32[(vals + i * 4) >> 2];
        row.push(vp ? UTF8ToString(vp) : 'NULL');
      }
      res.push(row);
      return 0;
    }, 'iiii');

    const ep = mod._malloc(4);
    const rc = mod._sqlite3_exec(db, sp, cb, 0, ep);
    mod._free(sp);
    mod.removeFunction(cb);

    if (rc !== 0) {
      const em = mod.HEAP32[ep >> 2];
      const errMsg = em ? mod.UTF8ToString(em) : 'Code ' + rc;
      throw new Error(errMsg);
    }

    mod._free(ep);

    const execTime = Date.now() - execStart;
    log('Query executed in:', execTime + 'ms');
    log('Results:', res.length, 'rows');

    let html = '<div class=ok>✓ ' + res.length + ' rows (' + execTime + 'ms)</div><table>';
    res[0].forEach((_, i) => html += '<th>Col ' + (i + 1) + '</th>');
    html += '</tr><tbody>';
    res.forEach(row => {
      html += '<tr>';
      row.forEach(cell => html += '<td>' + cell + '</td>');
      html += '</tr>';
    });
    html += '</table>';
    document.getElementById('d').innerHTML = html;

  } catch (error) {
    log('ERROR executing:', error.message);
    document.getElementById('d').innerHTML = '<div class=err>Error: ' + error.message + '</div>';
  }
}
</script>
</body>
</html>
