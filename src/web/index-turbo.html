<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite Turbo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font: 13px -apple-system, system-ui, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.4;
        }
        #app {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #fff;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #ddd;
        }
        h1 { font-size: 1.25rem; color: #2563eb; }
        .links {
            font-size: 11px;
            margin-top: 0.25rem;
            color: #666;
        }
        .links a { color: #2563eb; text-decoration: none; }
        main {
            flex: 1;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        section {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 0.75rem;
        }
        h2 {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        #sql-input {
            width: 100%;
            height: 100px;
            padding: 0.5rem;
            font: 12px monospace;
            border: 1px solid #ddd;
            border-radius: 3px;
            resize: vertical;
            background: #f9f9f9;
        }
        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        button {
            padding: 0.4rem 0.75rem;
            border: none;
            border-radius: 3px;
            font: 13px system-ui;
            cursor: pointer;
            background: #e5e5e5;
            color: #333;
        }
        button:hover { background: #d5d5d5; }
        #execute-btn { background: #2563eb; color: white; }
        #execute-btn:hover { background: #1d4ed8; }
        #output {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 0.5rem;
            font: 12px monospace;
            min-height: 40px;
        }
        #event-log {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 0.5rem;
            overflow-y: auto;
            font: 11px monospace;
            min-height: 100px;
            max-height: 200px;
        }
        .event {
            padding: 0.2rem 0.4rem;
            margin-bottom: 0.2rem;
            background: #fff;
            border-left: 2px solid #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        footer {
            background: #fff;
            padding: 0.4rem 1rem;
            border-top: 1px solid #ddd;
            font: 11px system-ui;
            color: #666;
        }
        #loading {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #loading.hidden { display: none; }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #ddd;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { margin-top: 0.75rem; color: #666; }
        label { display: flex; align-items: center; gap: 0.25rem; font-size: 12px; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>SQLite Turbo ⚡</h1>
            <div class="links">
                <a href="index-turbo.html">Turbo</a> |
                <a href="index-fast.html">Fast</a> |
                <a href="index-full.html">Full</a>
            </div>
        </header>

        <main>
            <section>
                <h2>SQL Editor</h2>
                <textarea id="sql-input" spellcheck="false">CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER);
INSERT INTO users VALUES (1, 'Alice', 30);
SELECT * FROM users;</textarea>
                <div class="btn-group">
                    <button id="execute-btn">Execute</button>
                    <button id="clear-btn">Clear</button>
                </div>
            </section>

            <section>
                <h2>Output</h2>
                <div id="output"></div>
            </section>

            <section>
                <h2>Events <button id="clear-events-btn">Clear</button></h2>
                <label><input type="checkbox" id="events-toggle"> Enable Events</label>
                <div id="event-log"></div>
            </section>
        </main>

        <footer>
            <span id="db-status">Loading...</span> |
            Events: <span id="event-count">0</span>
        </footer>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Loading SQLite...</p>
    </div>

    <script src="build/sqlite3.js"></script>
    <script src="js/events-turbo.js"></script>
    <script src="js/main-turbo.js"></script>
</body>
</html>
