<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Performance Test</title>
</head>
<body>
    <h1>SQLite Performance Diagnostic</h1>
    <div id="log"></div>

    <script>
        const log = document.getElementById('log');

        function addLog(msg) {
            const time = performance.now().toFixed(0);
            log.innerHTML += `<div>[${time}ms] ${msg}</div>`;
            console.log(msg);
        }

        addLog('Page loaded');

        // Test 1: HTML parsing
        addLog('Starting SQLite WASM load...');

        const loadStart = performance.now();

        // Load SQLite
        const script = document.createElement('script');
        script.src = 'build/sqlite3.js';
        script.onload = function() {
            const loadTime = (performance.now() - loadStart).toFixed(0);
            addLog(`✓ sqlite3.js loaded: ${loadTime}ms`);

            // Test 2: Module creation
            const moduleStart = performance.now();
            createSQLiteModule().then(module => {
                const moduleTime = (performance.now() - moduleStart).toFixed(0);
                addLog(`✓ WASM module compiled: ${moduleTime}ms`);

                // Test 3: Database open
                const dbStart = performance.now();
                const dbPath = ':memory:';
                const dbPathLen = module.lengthBytesUTF8(dbPath) + 1;
                const dbPathPtr = module._malloc(dbPathLen);
                module.stringToUTF8(dbPath, dbPathPtr, dbPathLen);
                const dbPtrPtr = module._malloc(4);
                const result = module._sqlite3_open(dbPathPtr, dbPtrPtr);

                if (result === 0) {
                    const db = module.HEAP32[dbPtrPtr >> 2];
                    module._free(dbPathPtr);
                    module._free(dbPtrPtr);
                    const dbTime = (performance.now() - dbStart).toFixed(0);
                    addLog(`✓ Database opened: ${dbTime}ms`);

                    const totalTime = (performance.now() - loadStart).toFixed(0);
                    addLog(`<strong>TOTAL INIT TIME: ${totalTime}ms</strong>`);

                    if (totalTime > 5000) {
                        addLog('<span style="color:red">⚠️ SLOW: Init took >5 seconds!</span>');
                        addLog('This is likely due to WASM compilation.');
                        addLog('Recommendations:');
                        addLog('1. Use a faster browser (Chrome > Firefox > Safari)');
                        addLog('2. Ensure COOP/COEP headers are set for shared memory');
                        addLog('3. Consider using --js-flags during build');
                    } else {
                        addLog('<span style="color:green">✓ Performance is acceptable</span>');
                    }
                } else {
                    addLog('✗ Failed to open database');
                }
            }).catch(err => {
                addLog('✗ Error: ' + err.message);
            });
        };

        script.onerror = function() {
            addLog('✗ Failed to load sqlite3.js');
        };

        document.head.appendChild(script);
    </script>
</body>
</html>
