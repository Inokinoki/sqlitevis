<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite SQL</title>
    <link rel="stylesheet" href="css/style.css">
    <style>.right-panel{display:none}.main-layout{grid-template-columns:1fr}.left-panel{max-width:800px;margin:0 auto}</style>
</head>
<body>
    <div class="container">
        <header><h1>SQLite SQL Runner</h1></header>
        <div class="main-layout">
            <div class="left-panel">
                <section class="sql-editor-section">
                    <h2>SQL Editor</h2>
                    <textarea id="sql-input">SELECT 1;</textarea>
                    <div class="button-group">
                        <button id="execute-btn">Execute</button>
                        <button id="clear-btn">Clear</button>
                    </div>
                </section>
                <section class="output-section">
                    <h2>Results</h2>
                    <div id="output"></div>
                </section>
                <section class="events-section">
                    <h2>Events</h2>
                    <div id="event-log"></div>
                </section>
            </div>
        </div>
        <footer><span id="db-status">Loading...</span></footer>
    </div>
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Loading SQLite...</p>
    </div>
    <script src="build/sqlite3.js"></script>
    <script>
        let db, module;
        function init() {
            createSQLiteModule().then(m => {
                module = m;
                const path = ':memory:';
                const ptr = module._malloc(module.lengthBytesUTF8(path) + 1);
                module.stringToUTF8(path, ptr);
                const dbPtr = module._malloc(4);
                module._sqlite3_open(ptr, dbPtr);
                db = module.HEAP32[dbPtr >> 2];
                module._free(ptr);
                module._free(dbPtr);
                document.getElementById('loading-overlay').classList.add('hidden');
                document.getElementById('db-status').textContent = 'Ready';
            });
        }
        function execute() {
            const sql = document.getElementById('sql-input').value;
            const ptr = module._malloc(module.lengthBytesUTF8(sql) + 1);
            module.stringToUTF8(sql, ptr);
            const err = module._malloc(4);
            module._sqlite3_exec(db, ptr, 0, 0, err);
            module._free(ptr);
            if (module.HEAP32[err >> 2]) {
                document.getElementById('output').textContent = module.UTF8ToString(module.HEAP32[err >> 2]);
            } else {
                document.getElementById('output').textContent = 'Success!';
            }
            module._free(err);
        }
        document.getElementById('execute-btn').onclick = execute;
        document.getElementById('clear-btn').onclick = () => {
            document.getElementById('sql-input').value = '';
            document.getElementById('output').textContent = '';
        };
        init();
    </script>
</body>
</html>
