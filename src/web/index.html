<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQLite</title>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{font:12px system-ui;background:#f8f9fa;padding:10px;max-width:600px;margin:0 auto}h1{color:#2563eb;font-size:16px;margin-bottom:3px}.ver{font-size:9px;color:#6c757d;margin-bottom:8px}.ver a{color:#2563eb;text-decoration:none;margin-right:4px}.ver a:hover{text-decoration:underline}textarea{width:100%;height:80px;font:11px monospace;padding:5px;border:1px solid #dee2e6;background:#fff;margin-bottom:5px;resize:vertical;border-radius:2px;font-family:'SF Mono',Monaco,monospace;line-height:1.2}.btns{margin-bottom:6px}button{padding:5px 10px;border:none;background:#2563eb;color:#fff;cursor:pointer;margin-right:4px;font:11px system-ui;border-radius:2px}button:hover{background:#1d4ed8}button:disabled{background:#adb5bd;cursor:not-allowed}button.sec{background:#e9ecef;color:#212529}button.sec:hover{background:#dee2e6}#out{background:#fff;border:1px solid #dee2e6;padding:6px;min-height:30px;margin-top:5px;border-radius:2px;font:10px monospace;white-space:pre-wrap;word-break:break-all;font-family:'SF Mono',Monaco,monospace;line-height:1.3}.err{color:#dc3545}.ok{color:#198754}.load{color:#6c757d;font-style:italic}@keyframes s{to{transform:rotate(360deg)}}.spin{display:inline-block;width:8px;height:8px;border:2px solid #dee2e6;border-top-color:#2563eb;border-radius:50%;animation:s 1s linear infinite;margin-right:3px;vertical-align:middle}</style>
</head>
<body>
  <h1>SQLite</h1>
  <div class="ver"><a href="minimal.html">⚡</a> <a href="index-turbo.html">Turbo</a> <a href="index-fast.html">Fast</a> <a href="index-full.html">Full</a></div>
  <textarea id="sql" spellcheck="false">CREATE TABLE u(id INTEGER PRIMARY KEY, n TEXT, a INTEGER);
INSERT INTO u VALUES(1, 'Alice', 30);
INSERT INTO u VALUES(2, 'Bob', 25);
SELECT * FROM u;</textarea>
  <div class="btns"><button id="runBtn" onclick="run()" disabled><span class="spin" style="display:none" id="spin"></span>Run</button><button class="sec" onclick="clr()">Clear</button></div>
  <div id="out" class="load">Loading...</div>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    let db, mod, ready = false, cbPtr = 0;
    (function(){
      const s = document.createElement('script');
      s.src = 'build/sqlite3.js';
      s.async = true;
      s.onload = init;
      document.head.appendChild(s);
    })();
    async function init(){
      if (typeof createSQLiteModule === 'undefined') {
        document.getElementById('out').textContent = 'Module not found';
        document.getElementById('out').className = 'err';
        return;
      }
      try {
        mod = await createSQLiteModule();
        const p = mod._malloc(mod.lengthBytesUTF8(':memory:') + 1);
        mod.stringToUTF8(':memory:', p, mod.lengthBytesUTF8(':memory:') + 1);
        const pp = mod._malloc(4);
        if (mod._sqlite3_open(p, pp) !== 0) throw new Error('Open failed');
        db = mod.HEAP32[pp >> 2];
        mod._free(p);
        mod._free(pp);
        ready = true;
        document.getElementById('out').textContent = '✓ Ready';
        document.getElementById('out').className = 'ok';
        document.getElementById('runBtn').disabled = false;
      } catch(e) {
        document.getElementById('out').textContent = 'Error: ' + e.message;
        document.getElementById('out').className = 'err';
      }
    }
    function run(){
      if (!ready) return;
      const sql = document.getElementById('sql').value.trim();
      if (!sql) {
        document.getElementById('out').textContent = 'Enter SQL';
        document.getElementById('out').className = 'err';
        return;
      }
      const spin = document.getElementById('spin');
      const btn = document.getElementById('runBtn');
      spin.style.display = 'inline-block';
      btn.disabled = true;
      requestAnimationFrame(() => {
        try {
          const sp = mod._malloc(mod.lengthBytesUTF8(sql) + 1);
          mod.stringToUTF8(sql, sp, mod.lengthBytesUTF8(sql) + 1);
          const results = [];
          if (!cbPtr) {
            cbPtr = mod.addFunction((n, cols, vals) => {
              const row = [];
              for (let i = 0; i < cols; i++) {
                const vp = HEAP32[(vals + i * 4) >> 2];
                row.push(vp ? UTF8ToString(vp) : 'NULL');
              }
              results.push(row);
              return 0;
            }, 'iiii');
          }
          const ep = mod._malloc(4);
          const rc = mod._sqlite3_exec(db, sp, cbPtr, 0, ep);
          mod._free(sp);
          if (rc) {
            const em = mod.HEAP32[ep >> 2];
            document.getElementById('out').textContent = 'Error: ' + (em ? mod.UTF8ToString(em) : 'Code ' + rc);
            document.getElementById('out').className = 'err';
          } else {
            showRes(results);
          }
          mod._free(ep);
        } catch(e) {
          document.getElementById('out').textContent = 'Error: ' + e.message;
          document.getElementById('out').className = 'err';
        }
        spin.style.display = 'none';
        btn.disabled = false;
      });
    }
    function showRes(results){
      if (!results.length) {
        document.getElementById('out').textContent = '✓ Done';
        document.getElementById('out').className = 'ok';
        return;
      }
      let txt = '';
      results.forEach(r => {
        txt += r.join(' | ') + '\n';
      });
      txt += '\n' + results.length + ' rows';
      document.getElementById('out').textContent = txt;
      document.getElementById('out').className = 'ok';
    }
    function clr(){
      document.getElementById('sql').value = '';
      document.getElementById('out').textContent = '';
      document.getElementById('out').className = '';
    }
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        run();
      }
    });
  </script>
</body>
</html>
