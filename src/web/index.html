<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite - Fast SQL Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font: 13px system-ui, -apple-system, sans-serif;
            background: #fff;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            color: #2563eb;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font: 12px monospace;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            resize: vertical;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #1d4ed8; }
        #output {
            padding: 15px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 100px;
            font: 12px monospace;
            white-space: pre-wrap;
        }
        .error { color: #dc3545; }
        .success { color: #198754; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 12px;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background: #f3f4f6; font-weight: 600; }
        .stats {
            margin-top: 10px;
            padding: 10px;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 4px;
            font-size: 12px;
            color: #0369a1;
        }
        #loading {
            display: none;
            padding: 10px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            margin-bottom: 10px;
            text-align: center;
            color: #856404;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 SQLite Fast SQL Interface</h1>
        <p class="subtitle">Instant SQL execution using WebAssembly SQLite</p>

        <div id="loading" class="">
            Loading SQLite (1.5MB, one-time download)...<br>
            <small>Subsequent loads will be instant (&lt;100ms)</small>
        </div>

        <textarea id="sql" spellcheck="false">CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER);
INSERT INTO users VALUES (1, 'Alice', 30);
INSERT INTO users VALUES (2, 'Bob', 25);
SELECT * FROM users;</textarea>

        <div>
            <button onclick="runSQL()">▶ Execute SQL</button>
            <button onclick="clearSQL()">Clear</button>
            <button onclick="loadExample()">Load Example</button>
        </div>

        <div id="output"></div>

        <div class="stats" id="stats">
            Status: <strong>Initializing...</strong>
        </div>
    </div>

    <script>
        let db = null;
        let mod = null;
        let ready = false;
        const T0 = performance.now();

        // Update stats
        function updateStats(message) {
            const stats = document.getElementById('stats');
            const loadTime = ((performance.now() - T0) / 1000).toFixed(2);
            stats.innerHTML = `${message} | Load time: <strong>${loadTime}s</strong>`;
        }

        // Load SQLite WASM
        const script = document.createElement('script');
        script.src = 'build/sqlite3.js';
        script.async = true;
        script.onload = init;

        // Show loading message
        document.getElementById('loading').style.display = 'block';
        document.head.appendChild(script);

        async function init() {
            const output = document.getElementById('output');

            if (typeof createSQLiteModule === 'undefined') {
                output.innerHTML = '<div class="error">Error: SQLite module not found. Make sure build/sqlite3.js exists.</div>';
                updateStats('Error');
                return;
            }

            try {
                const start = Date.now();
                mod = await createSQLiteModule();

                // Open in-memory database
                const pathPtr = mod._malloc(mod.lengthBytesUTF8(':memory:') + 1);
                mod.stringToUTF8(':memory:', pathPtr, mod.lengthBytesUTF8(':memory:') + 1);
                const dbPtrPtr = mod._malloc(4);
                const result = mod._sqlite3_open(pathPtr, dbPtrPtr);

                if (result !== 0) {
                    throw new Error('Failed to open database: ' + result);
                }

                db = mod.HEAP32[dbPtrPtr >> 2];
                mod._free(pathPtr);
                mod._free(dbPtrPtr);

                ready = true;
                const initTime = ((Date.now() - start) / 1000).toFixed(1);
                document.getElementById('loading').style.display = 'none';
                updateStats(`✅ Ready (initialized in ${initTime}s)`);
                output.innerHTML = '<div class="success">✅ SQLite ready! Click "Execute SQL" to run queries.</div>';

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                output.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
                updateStats('Error');
                console.error(error);
            }
        }

        function runSQL() {
            if (!ready) {
                document.getElementById('output').innerHTML = '<div class="error">Please wait for SQLite to finish loading...</div>';
                return;
            }

            const sql = document.getElementById('sql').value.trim();
            if (!sql) {
                document.getElementById('output').innerHTML = '<div class="error">Please enter SQL</div>';
                return;
            }

            const t0 = performance.now();

            try {
                // Split multiple statements
                const statements = sql.split(';').filter(s => s.trim());
                let allResults = [];
                let totalRows = 0;

                statements.forEach(statement => {
                    const sqlPtr = mod._malloc(mod.lengthBytesUTF8(statement) + 1);
                    mod.stringToUTF8(statement, sqlPtr, mod.lengthBytesUTF8(statement) + 1);

                    const results = [];
                    const callback = mod.addFunction((rowNum, cols, values) => {
                        const row = [];
                        for (let i = 0; i < cols; i++) {
                            const valuePtr = mod.HEAP32[(values + i * 4) >> 2];
                            row.push(valuePtr ? mod.UTF8ToString(valuePtr) : 'NULL');
                        }
                        results.push(row);
                        totalRows++;
                        return 0;
                    }, 'iiii');

                    const errorPtr = mod._malloc(4);
                    const rc = mod._sqlite3_exec(db, sqlPtr, callback, 0, errorPtr);
                    mod._free(sqlPtr);
                    mod.removeFunction(callback);

                    if (rc !== 0) {
                        const errorPtrValue = mod.HEAP32[errorPtr >> 2];
                        const errorMessage = errorPtrValue ? mod.UTF8ToString(errorPtrValue) : 'Error code: ' + rc;
                        mod._free(errorPtr);
                        throw new Error(errorMessage);
                    }

                    mod._free(errorPtr);

                    if (results.length > 0) {
                        allResults = allResults.concat(results);
                    }
                });

                const execTime = ((performance.now() - t0)).toFixed(2);

                // Display results
                if (allResults.length === 0) {
                    document.getElementById('output').innerHTML =
                        '<div class="success">✅ Statement executed successfully (no results returned)</div>';
                } else {
                    let html = `<div class="success">✅ ${allResults.length} row${allResults.length > 1 ? 's' : ''} returned (${execTime}ms)</div><table><thead><tr>`;
                    allResults[0].forEach((_, i) => html += '<th>Column ' + (i + 1) + '</th>');
                    html += '</tr></thead><tbody>';
                    allResults.forEach(row => {
                        html += '<tr>';
                        row.forEach(cell => html += '<td>' + escapeHtml(cell) + '</td>');
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    document.getElementById('output').innerHTML = html;
                }

                updateStats(`✅ Executed in ${execTime}ms`);

            } catch (error) {
                document.getElementById('output').innerHTML =
                    '<div class="error">Error: ' + escapeHtml(error.message) + '</div>';
                updateStats('❌ Error');
            }
        }

        function clearSQL() {
            document.getElementById('sql').value = '';
            document.getElementById('output').innerHTML = '';
            updateStats('Cleared');
        }

        function loadExample() {
            document.getElementById('sql').value =
`CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT, price REAL);
INSERT INTO products VALUES (1, 'Widget', 19.99);
INSERT INTO products VALUES (2, 'Gadget', 29.99);
INSERT INTO products VALUES (3, 'Doohickey', 14.99);

-- Query all products
SELECT * FROM products WHERE price < 25;

-- Calculate average price
SELECT AVG(price) as avg_price FROM products;`;
            updateStats('Example loaded');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Keyboard shortcut: Ctrl+Enter to execute
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                runSQL();
            }
        });

        console.log('SQLite Fast Interface loaded. Use Ctrl+Enter to execute SQL.');
    </script>
</body>
</html>
