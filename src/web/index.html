<!doctype html><html><head><meta charset=UTF-8><title>SQL</title>
<link rel=preload href=build/sqlite3.js as=script>
<link rel=preload href=build/sqlite3.wasm as=fetch crossorigin>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font:11px system-ui;background:#f8f9fa;padding:8px;max-width:550px;margin:0 auto}h1{color:#2563eb;font-size:14px;margin-bottom:2px}.v{font-size:8px;color:#6c757d;margin-bottom:5px}.v a{color:#2563eb;text-decoration:none;margin-right:3px}textarea{width:100%;height:70px;font:10px monospace;padding:4px;border:1px solid #dee2e6;background:#fff;margin-bottom:4px;resize:vertical;border-radius:2px;font-family:monospace;line-height:1.1}.b{margin-bottom:4px}button{padding:4px 8px;border:none;background:#2563eb;color:#fff;cursor:pointer;margin-right:3px;font:10px system-ui;border-radius:2px}button:hover{background:#1d4ed8}button:disabled{background:#adb5bd;cursor:not-allowed}button.s{background:#e9ecef;color:#212529}button.s:hover{background:#dee2e6}#o{background:#fff;border:1px solid #dee2e6;padding:4px;min-height:25px;margin-top:4px;border-radius:2px;font:9px monospace;white-space:pre-wrap;word-break:break-all;font-family:monospace;line-height:1.2}.e{color:#dc3545}.ok{color:#198754}.l{color:#6c757d}@keyframes a{to{transform:rotate(360deg)}}.sp{display:inline-block;width:6px;height:6px;border:2px solid #dee2e6;border-top-color:#2563eb;border-radius:50%;animation:a 1s linear infinite;margin-right:2px;vertical-align:middle}</style>
</head><body>
<h1>SQLite</h1>
<div class=v><a href=minimal.html>⚡</a> <a href=index-turbo.html>Trb</a> <a href=index-fast.html>Fst</a> <a href=index-full.html>Full</a></div>
<textarea id=sql spellcheck=false>CREATE TABLE t(id INTEGER PRIMARY KEY, n TEXT);
INSERT INTO t VALUES(1, 'Alice');
SELECT * FROM t;</textarea>
<div class=b><button id=r onclick=r() disabled><span class=sp id=sp></span>Run</button><button class=s onclick=c()>Clr</button></div>
<div id=o class=l>Loading...</div>
<script>
let db,mod,ok=0,cb=0;
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){
  const s=document.createElement('script');
  s.src='build/sqlite3.js';
  s.async=true;
  s.onload=i;
  document.head.appendChild(s);
})();
async function i(){
  if(typeof createSQLiteModule==='undefined'){
    document.getElementById('o').textContent='Err: Module not found';
    document.getElementById('o').className='e';
    return
  }
  try{
    mod=await createSQLiteModule();
    const p=mod._malloc(mod.lengthBytesUTF8(':memory:')+1);
    mod.stringToUTF8(':memory:',p,mod.lengthBytesUTF8(':memory:')+1);
    const pp=mod._malloc(4);
    if(mod._sqlite3_open(p,pp)!==0)throw new Error('Open failed');
    db=mod.HEAP32[pp>>2];
    mod._free(p);
    mod._free(pp);
    ok=1;
    document.getElementById('o').textContent='✓ Ready';
    document.getElementById('o').className='ok';
    document.getElementById('r').disabled=!1;
    document.getElementById('sp').style.display='none'
  }catch(e){
    document.getElementById('o').textContent='Err: '+e.message;
    document.getElementById('o').className='e'
  }
}
function r(){
  if(!ok)return;
  const s=document.getElementById('sql').value.trim();
  if(!s){
    document.getElementById('o').textContent='Enter SQL';
    document.getElementById('o').className='e';
    return
  }
  document.getElementById('r').disabled=!0;
  requestAnimationFrame(()=>{
    try{
      const sp=mod._malloc(mod.lengthBytesUTF8(s)+1);
      mod.stringToUTF8(s,sp,mod.lengthBytesUTF8(s)+1);
      const res=[];
      if(!cb){
        cb=mod.addFunction((n,c,v)=>{
          const row=[];
          for(let i=0;i<c;i++){
            const vp=HEAP32[(v+i*4)>>2];
            row.push(vp?UTF8ToString(vp):'NULL')
          }
          res.push(row);
          return 0
        },'iiii')
      }
      const ep=mod._malloc(4);
      const rc=mod._sqlite3_exec(db,sp,cb,0,ep);
      mod._free(sp);
      if(rc){
        const em=mod.HEAP32[ep>>2];
        document.getElementById('o').textContent=em?mod.UTF8ToString(em):'Err '+rc;
        document.getElementById('o').className='e'
      }else{
        document.getElementById('o').textContent=res.map(r=>r.join('|')).join('\n')+'\n\n'+res.length+' rows';
        document.getElementById('o').className='ok'
      }
      mod._free(ep)
    }catch(e){
      document.getElementById('o').textContent='Err: '+e.message;
      document.getElementById('o').className='e'
    }
    document.getElementById('r').disabled=!1
  })
}
function c(){
  document.getElementById('sql').value='';
  document.getElementById('o').textContent='';
  document.getElementById('o').className=''
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
    e.preventDefault();
    r()
  }
});
</script></body></html>
