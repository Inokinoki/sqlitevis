<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite B-Tree Visualization</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SQLite B-Tree Visualization</h1>
            <p class="subtitle">Instant load - No WASM</p>
        </header>

        <div class="main-layout">
            <div class="left-panel">
                <section class="sql-editor-section">
                    <h2>SQL Editor</h2>
                    <textarea id="sql-input" placeholder="Enter SQL...">SELECT * FROM users</textarea>
                    <div class="button-group">
                        <button id="execute-btn" class="btn btn-primary">Execute</button>
                        <button id="clear-btn" class="btn btn-secondary">Clear</button>
                    </div>
                </section>

                <section class="output-section">
                    <h2>Results</h2>
                    <div id="output" class="output-box">
                        <p class="placeholder">Results appear here</p>
                    </div>
                </section>

                <section class="events-section">
                    <h2>Event Log</h2>
                    <div class="controls">
                        <label><input type="checkbox" id="auto-scroll" checked> Auto-scroll</label>
                        <button id="clear-events-btn" class="btn btn-small">Clear</button>
                    </div>
                    <div id="event-log" class="event-log"></div>
                </section>
            </div>

            <div class="right-panel">
                <section class="visualization-section">
                    <h2>B-Tree Visualization</h2>
                    <div class="viz-controls">
                        <label><select id="view-mode"><option value="btree">B-Tree</option></label>
                        <canvas id="visualization-canvas"></canvas>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        // Ultra-fast - zero WASM, minimal overhead
        const db = {};
        let eventCount = 0;

        function init() {
            document.getElementById('execute-btn').onclick = execute;
            document.getElementById('clear-btn').onclick = clear;
            document.getElementById('clear-events-btn').onclick = clearEvents;

            // Init sample data
            execSQL('CREATE TABLE users (id, name, age)');
            execSQL("INSERT INTO users VALUES (1, 'Alice', 30)");
            execSQL("INSERT INTO users VALUES (2, 'Bob', 25)");
            drawBTree();
        }

        function execute() {
            const sql = document.getElementById('sql-input').value.trim();
            const start = performance.now();
            try {
                const result = execSQL(sql);
                const time = (performance.now() - start).toFixed(2);
                showResult(result, time);
                addEvent('query', sql);
                drawBTree();
            } catch (e) {
                document.getElementById('output').innerHTML = `<p style="color:red">${e.message}</p>`;
            }
        }

        function execSQL(sql) {
            const u = sql.toUpperCase().trim();
            if (u.startsWith('CREATE')) {
                const m = sql.match(/CREATE\s+TABLE\s+(\w+)\s*\((.*)\)/i);
                if (!m) throw new Error('Invalid CREATE');
                db[m[1]] = { cols: m[2].split(',').map(c=>c.trim()), rows: [] };
                return {};
            }
            if (u.startsWith('INSERT')) {
                const m = sql.match(/INSERT\s+INTO\s+(\w+)\s+VALUES\s*\((.*)\)/i);
                if (!m || !db[m[1]]) throw new Error('Invalid INSERT');
                const v = m[2].split(',').map(x=>x.trim());
                const r = {};
                db[m[1]].cols.forEach((c,i)=>r[c]=v[i]||null);
                db[m[1]].rows.push(r);
                return {};
            }
            if (u.startsWith('SELECT')) {
                const m = sql.match(/SELECT\s+(.+?)\s+FROM\s+(\w+)/i);
                if (!m || !db[m[2]]) throw new Error('Invalid SELECT');
                const t = db[m[2]];
                const c = m[1].trim()=='*'?t.cols:m[1].trim().split(',').map(x=>x.trim());
                return t.rows.map(r=>c.map(x=>r[x]));
            }
            throw new Error('Use CREATE, INSERT, SELECT');
        }

        function showResult(r, time) {
            if (!r || !r.length) {
                document.getElementById('output').innerHTML = `<p>Done (${time}ms)</p>`;
                return;
            }
            let h = `<p>${r.length} rows (${time}ms)</p><table><tr>`;
            r[0].forEach((_,i)=>h+=`<th>Col ${i+1}</th>`);
            h+='</tr>';
            r.forEach(row=>{h+='<tr>';row.forEach(c=>h+=`<td>${c===null?'NULL':c}</td>`);h+='</tr>';});
            h+='</table>';
            document.getElementById('output').innerHTML = h;
        }

        function drawBTree() {
            const cvs = document.getElementById('visualization-canvas');
            const ctx = cvs.getContext('2d');
            cvs.width = cvs.clientWidth-40;
            cvs.height = 300;
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0,0,cvs.width,cvs.height);

            if (!db.users || !db.users.rows.length) return;

            ctx.fillStyle = '#38bdf8';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('B-Tree', cvs.width/2, 30);

            const w=50, g=10;
            const x = (cvs.width - Math.min(db.users.rows.length,6)*(w+g))/2;
            db.users.rows.slice(0,6).forEach((r,i)=>{
                const X = x+i*(w+g);
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(X,80,w,40);
                ctx.strokeStyle = '#334155';
                ctx.strokeRect(X,80,w,40);
                ctx.fillStyle = '#fff';
                ctx.font = '11px monospace';
                ctx.fillText(r.id, X+w/2, 100);
            });
        }

        function addEvent(type, msg) {
            eventCount++;
            const log = document.getElementById('event-log');
            log.innerHTML = `<div>[${new Date().toLocaleTimeString()}] ${type}: ${msg}</div>` + log.innerHTML;
            document.getElementById('event-count').textContent = eventCount;
        }

        function clear() {
            document.getElementById('sql-input').value = '';
            document.getElementById('output').innerHTML = '<p class="placeholder">Results appear here</p>';
        }

        function clearEvents() {
            eventCount = 0;
            document.getElementById('event-log').innerHTML = '';
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
