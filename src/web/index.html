<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SQLite Fast</title>
  <script src="../node_modules/alasql/dist/alasql.min.js"></script>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{font:12px system-ui;background:#f8f9fa;padding:10px;max-width:650px;margin:0 auto}h1{color:#2563eb;font-size:18px;margin-bottom:5px}.v{font-size:10px;color:#6c757d;margin-bottom:10px}.v a{color:#2563eb;text-decoration:none;margin-right:6px}textarea{width:100%;height:120px;font:12px monospace;padding:8px;border:1px solid #dee2e6;background:#fff;margin-bottom:8px;resize:vertical;border-radius:4px;font-family:'SF Mono',Monaco,monospace}.b{margin-bottom:8px}button{padding:7px 14px;border:none;background:#2563eb;color:#fff;cursor:pointer;margin-right:6px;font:12px system-ui;border-radius:4px;font-weight:500}button:hover{background:#1d4ed8}button:disabled{background:#adb5bd;cursor:not-allowed}button.s{background:#e9ecef;color:#212529}button.s:hover{background:#dee2e6}#o{background:#fff;border:1px solid #dee2e6;padding:10px;min-height:40px;margin-top:8px;border-radius:4px;font-size:11px;white-space:pre-wrap;overflow:auto;max-height:400px}.e{color:#dc3545;background:#f8d7da;padding:10px;border-radius:4px}.ok{color:#198754;background:#d1e7dd;padding:10px;border-radius:4px}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}th,td{padding:6px;text-align:left;border-bottom:1px solid #dee2e6}th{background:#f8f9fa;font-weight:600}tr:hover{background:#f8f9fa}.l{color:#0d6efd;background:#cfe2ff;padding:10px;border-radius:4px;margin-bottom:8px}@keyframes s{to{transform:rotate(360deg)}}.sp{display:inline-block;width:12px;height:12px;border:2px solid #dee2e6;border-top-color:#2563eb;border-radius:50%;animation:s 1s linear infinite;margin-right:6px;vertical-align:middle}</style>
</head>
<body>
  <h1>SQLite Fast</h1>
  <div class="v"><a href="instant.html">Instant (Mini)</a> | <a href="index-wasm.html">WASM (Full SQLite)</a> | <a href="index-fast.html">Fast</a> | <a href="index-full.html">Full</a></div>

  <div class="l"><span class="sp"></span>Loading AlaSQL (500KB) - Full SQL support with JOINs, aggregates, functions...</div>

  <textarea id="sql" spellcheck="false" disabled>Loading...</textarea>

  <div class="b"><button id="runBtn" onclick="run()" disabled>Run SQL (Ctrl+Enter)</button><button class="s" onclick="clr()">Clear</button><button class="s" onclick="ex()">Example</button></div>

  <div id="o"></div>

  <script>
    let ready = false;

    window.addEventListener('load', () => {
      setTimeout(() => {
        ready = true;
        document.getElementById('sql').disabled = false;
        document.getElementById('runBtn').disabled = false;
        document.getElementById('sql').value = `CREATE TABLE users(id INTEGER PRIMARY KEY, name TEXT, age INTEGER);
INSERT INTO users VALUES(1, 'Alice', 30);
INSERT INTO users VALUES(2, 'Bob', 25);
INSERT INTO users VALUES(3, 'Charlie', 35);
SELECT * FROM users;`;
        document.getElementById('o').innerHTML = '<div class="ok">✓ Ready - Full SQL support with AlaSQL</div>';
      }, 100);
    });

    function run() {
      if (!ready) return;

      const sql = document.getElementById('sql').value.trim();
      if (!sql) {
        showError('Please enter SQL');
        return;
      }

      try {
        // Use alasql for full SQL support
        const result = alasql(sql);

        if (Array.isArray(result)) {
          if (result.length === 0) {
            showSuccess('✓ Query completed (no results)');
          } else if (typeof result[0] === 'object') {
            // Object array - display as table
            showTable(result);
          } else {
            // Primitive array
            showArray(result);
          }
        } else if (result === undefined) {
          showSuccess('✓ Statement executed successfully');
        } else {
          // Single value
          showSuccess('✓ Result: ' + result);
        }
      } catch (e) {
        showError(e.message || 'Error executing SQL');
      }
    }

    function showTable(data) {
      const keys = Object.keys(data[0]);
      let html = '<div class="ok">✓ ' + data.length + ' rows</div><table><thead><tr>';
      keys.forEach(k => html += '<th>' + esc(k) + '</th>');
      html += '</tr></thead><tbody>';
      data.forEach(row => {
        html += '<tr>';
        keys.forEach(k => html += '<td>' + esc(String(row[k] ?? 'NULL')) + '</td>');
        html += '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('o').innerHTML = html;
    }

    function showArray(data) {
      let html = '<div class="ok">✓ ' + data.length + ' rows</div><table>';
      data.forEach(row => {
        html += '<tr>';
        if (Array.isArray(row)) {
          row.forEach(v => html += '<td>' + esc(String(v ?? 'NULL')) + '</td>');
        } else {
          html += '<td>' + esc(String(row ?? 'NULL')) + '</td>';
        }
        html += '</tr>';
      });
      html += '</table>';
      document.getElementById('o').innerHTML = html;
    }

    function showSuccess(msg) {
      document.getElementById('o').innerHTML = '<div class="ok">' + esc(msg) + '</div>';
    }

    function showError(msg) {
      document.getElementById('o').innerHTML = '<div class="e">⚠ Error: ' + esc(msg) + '</div>';
    }

    function esc(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function clr() {
      document.getElementById('sql').value = '';
      document.getElementById('o').innerHTML = '';
    }

    function ex() {
      document.getElementById('sql').value = `-- Complex SQL example with JOIN
CREATE TABLE users(id INT, name STRING, age INT);
CREATE TABLE orders(id INT, user_id INT, product STRING, amount INT);

INSERT INTO users VALUES(1, 'Alice', 30);
INSERT INTO users VALUES(2, 'Bob', 25);
INSERT INTO users VALUES(3, 'Charlie', 35);

INSERT INTO orders VALUES(1, 1, 'Laptop', 1200);
INSERT INTO orders VALUES(2, 2, 'Mouse', 25);
INSERT INTO orders VALUES(3, 1, 'Keyboard', 80);

SELECT u.name, o.product, o.amount
FROM users u
JOIN orders o ON u.id = o.user_id
WHERE u.age > 25
ORDER BY o.amount DESC;`;
      document.getElementById('o').innerHTML = '<div style="color:#6c757d;padding:10px">Complex example loaded - shows JOIN support</div>';
    }

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        run();
      }
    });
  </script>
</body>
</html>
