<!doctype html><html><head><meta charset=UTF-8><title>SQL</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font:12px system-ui;background:#f8f9fa;padding:8px;max-width:600px;margin:0 auto}h1{color:#2563eb;font-size:16px;margin-bottom:4px}.v{font-size:9px;color:#6c757d;margin-bottom:6px}.v a{color:#2563eb;text-decoration:none;margin-right:4px}textarea{width:100%;height:100px;font:11px monospace;padding:6px;border:1px solid #dee2e6;background:#fff;margin-bottom:6px;resize:vertical;border-radius:3px;font-family:monospace}.b{margin-bottom:6px}button{padding:6px 12px;border:none;background:#2563eb;color:#fff;cursor:pointer;margin-right:4px;font:11px system-ui;border-radius:3px}button:hover{background:#1d4ed8}button.s{background:#e9ecef;color:#212529}button.s:hover{background:#dee2e6}#o{background:#fff;border:1px solid #dee2e6;padding:6px;min-height:30px;margin-top:6px;border-radius:3px;font-size:10px;white-space:pre-wrap}.e{color:#dc3545;background:#f8d7da;padding:6px;border-radius:3px}.ok{color:#198754;background:#d1e7dd;padding:6px;border-radius:3px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:4px;text-align:left;border-bottom:1px solid #dee2e6}th{background:#f8f9fa}tr:hover{background:#f8f9fa}.t{background:#cfe2ff;border:1px solid #b6d4fe;padding:6px;border-radius:3px;margin-bottom:6px;font-size:10px}</style>
</head><body>
<h1>SQLite</h1>
<div class=v><a href=index-wasm.html>WASM (Full SQLite)</a> | <a href=index-fast.html>Fast</a> | <a href=index-full.html>Full</a></div>
<div class=t>⚡ <strong>Instant Mode</strong> - Pure JavaScript, loads instantly</div>
<textarea id=sql spellcheck=false>CREATE TABLE u(id INTEGER PRIMARY KEY, n TEXT, a INTEGER);
INSERT INTO u VALUES(1, 'Alice', 30);
INSERT INTO u VALUES(2, 'Bob', 25);
SELECT * FROM u;</textarea>
<div class=b><button onclick=r()>Run (Ctrl+Enter)</button><button class=s onclick=c()>Clear</button><button class=s onclick=e()>Example</button></div>
<div id=o></div>
<script>
const DB={tables:{}};
function SQL(s){
  const stmts=s.split(';').map(x=>x.trim()).filter(x=>x);
  let out=[];
  for(const stmt of stmts){
    try{
      const u=stmt.toUpperCase();
      if(u.startsWith('CREATE TABLE')){
        const m=stmt.match(/CREATE TABLE (\w+) \((.*)\)/i);
        if(!m)throw E('Invalid CREATE');
        const [_,n,d]=m;
        DB.tables[n]={cols:d.split(',').map(c=>{const p=c.trim().split(/\s+/);return{n:p[0],t:p[1]||'TEXT'}}),rows:[]};
        out.push('✓ Created '+n)
      }else if(u.startsWith('DROP TABLE')){
        const m=stmt.match(/DROP TABLE (\w+)/i);
        if(!m)throw E('Invalid DROP');
        delete DB.tables[m[1]];
        out.push('✓ Dropped')
      }else if(u.startsWith('INSERT')){
        const m=stmt.match(/INSERT INTO (\w+) VALUES \((.*)\)/i);
        if(!m)throw E('Invalid INSERT');
        const [_,n,v]=m;
        if(!DB.tables[n])throw E('Table not found');
        DB.tables[n].rows.push(v.split(',').map(x=>{const t=x.trim();return t==="'?null:null:t.startsWith("'")?t.slice(1,-1):isNaN(t)?t:Number(t)}));
        out.push('✓ Inserted')
      }else if(u.startsWith('SELECT')){
        const m=stmt.match(/SELECT (.+) FROM (\w+)/i);
        if(!m)throw E('Invalid SELECT');
        const [_,cs,n]=m;
        if(!DB.tables[n])throw E('Table not found');
        const tbl=DB.tables[n];
        const all=cs.trim()==='*';
        const idx=all?tbl.cols.map((_,i)=>i):cs.split(',').map(c=>{const i=tbl.cols.findIndex(x=>x.n.toLowerCase()===c.trim().toLowerCase());if(i<0)throw E('Column not found');return i});
        const res=tbl.rows.map(r=>idx.map(i=>r[i]));
        R(res);
        return
      }else{
        throw E('Unsupported: '+stmt.split(' ')[0])
      }
    }catch(e){
      showErr(e.message);
      return
    }
  }
  show(out.join('\n'))
}
function R(res){
  let h='<div class=ok>✓ '+res.length+' rows</div><table><tr>';
  for(let i=0;i<res[0].length;i++)h+='<th>Col '+(i+1)+'</th>';
  h+='</tr>';
  for(const r of res){
    h+='<tr>';
    for(const c of r)h+='<td>'+(c===null?'<em>NULL</em>':esc(String(c)))+'</td>';
    h+='</tr>'
  }
  h+='</table>';
  document.getElementById('o').innerHTML=h
}
function E(m){return new Error(m)}
function showErr(m){document.getElementById('o').innerHTML='<div class=e>⚠ '+esc(m)+'</div>'}
function show(m){document.getElementById('o').innerHTML='<div class=ok>'+esc(m)+'</div>'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function r(){SQL(document.getElementById('sql').value)}
function c(){document.getElementById('sql').value='';document.getElementById('o').innerHTML=''}
function e(){document.getElementById('sql').value=`CREATE TABLE u(id INTEGER PRIMARY KEY, n TEXT, a INTEGER);\nINSERT INTO u VALUES(1, 'Alice', 30);\nINSERT INTO u VALUES(2, 'Bob', 25);\nINSERT INTO u VALUES(3, 'Charlie', 35);\nINSERT INTO u VALUES(4, 'Diana', 28);\nSELECT * FROM u;`;document.getElementById('o').innerHTML='<div style=color:#6c757d>Example loaded</div>'}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();r()}});
</script></body></html>
