<!doctype html><html><head><meta charset=utf-8><title>SQLite B-Tree</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#0d1117;color:#c9d1d9;padding:16px}.c{max-width:900px;margin:0 auto}h1{color:#58a6ff;font-size:20px;margin-bottom:8px}s{color:#8b949e;font-size:12px}#q{width:100%;height:80px;background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px;font-family:monospace;font-size:12px;resize:vertical}.b{margin:8px 0}button{background:#238636;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;margin-right:4px}button:hover{background:#2ea043}.b2{background:#30363d}.b2:hover{background:#3c444d}#o{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px;min-height:60px;max-height:300px;overflow:auto;font-size:11px}#v{background:#161b22;border:1px solid #30363d;border-radius:6px;height:200px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8b949e;padding:10px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:4px}th{background:#21262d;color:#58a6ff;padding:4px;text-align:left;font-size:10px;position:sticky;top:0}td{padding:4px;border-bottom:1px solid #30363d;font-size:10px}.t{color:#3fb950;font-size:10px;margin-bottom:4px}n{background:#0d1117;border:1px solid #30363d;border-radius:4px;padding:6px;min-width:50px;text-align:center;display:inline-block;margin:2px;font-family:monospace;font-size:10px}</style></head><body><div class=c><h1>SQLite B-Tree Visualization</h1><s id=s>Ready</s><textarea id=q placeholder=SQL...>SELECT * FROM users</textarea><div class=b><button onclick=r()>Run</button><button onclick=c() class=b2>Clear</button></div><div id=o>Run SQL to see results</div><h2 style=color:#58a6ff;font-size:14px;margin:16px 0 8px>B-Tree</h2><div id=v>B-Tree visualization appears here</div></div><script>const D={};function r(){const q=document.getElementById('q').value.trim();if(!q)return;const t0=performance.now();try{const x=ex(q);const t=(performance.now()-t0).toFixed(2);if(x.err){document.getElementById('o').innerHTML='<div style=color:#f85149>'+x.err+'</div>';return}if(x.rows){let h='<div class=t>'+x.rows.length+' rows ('+t+'ms)</div><table><tr>';x.headers.forEach(c=>h+='<th>'+c+'</th>');h+='</tr>';x.rows.forEach(r=>{h+='<tr>';r.forEach(c=>h+='<td>'+(c==null?'<span style=color:#8b949e>NULL</span>':c)+'</td>');h+='</tr>'});h+='</table>';document.getElementById('o').innerHTML=h;v(x)}else{document.getElementById('o').innerHTML='<div class=t>Done ('+t+'ms)</div>'}document.getElementById('s').textContent='Done in '+t+'ms'}catch(e){document.getElementById('o').innerHTML='<div style=color:#f85149>'+e.message+'</div>'}}function c(){document.getElementById('q').value='';document.getElementById('o').innerHTML='Run SQL to see results';document.getElementById('v').innerHTML='B-Tree visualization appears here';document.getElementById('s').textContent='Ready'}function ex(sql){sql=sql.trim();const u=sql.toUpperCase();if(u.startsWith('CREATE TABLE')){const m=sql.match(/CREATE\s+TABLE\s+(\w+)\s*\((.*)\)/i);if(!m)return{err:'Invalid CREATE'};const cols=m[2].split(',').map(c=>c.trim().split(/\s+/)[0]);D[m[1]]={cols,rows:[]};return{}}if(u.startsWith('INSERT')){const m=sql.match(/INSERT\s+INTO\s+(\w+)\s+VALUES\s*\((.*)\)/i);if(!m||!D[m[1]])return{err:'Invalid INSERT'};const vals=m[2].split(',').map(v=>v.trim());const row={};D[m[1]].cols.forEach((c,i)=>row[c]=vals[i]||null);D[m[1]].rows.push(row);return{}}if(u.startsWith('SELECT')){const m=sql.match(/SELECT\s+(.+?)\s+FROM\s+(\w+)/i);if(!m||!D[m[2]])return{err:'Invalid SELECT'};const t=D[m[2]];const cols=m[1].trim()==='*'?t.cols:m[1].trim().split(',').map(c=>c.trim());const rows=t.rows.map(r=>cols.map(c=>r[c]));return{rows,headers:cols}}return{err:'Use CREATE TABLE, INSERT, SELECT'}}function v(x){if(!x.rows)return;const d=document.getElementById('v');let h='<div style=color:#58a6ff;margin-bottom:8px>B-Tree Structure</div><div style=display:flex;flex-wrap:wrap;gap:4px;justify-content:center>';x.rows.slice(0,8).forEach(r=>{h+='<n>'+Object.values(r)[0]+'</n>'});if(x.rows.length>8)h+='<span style=color:#8b949e;padding:4px>+'+(x.rows.length-8)+' more</span>';h+='</div>';d.innerHTML=h}(function(){ex('CREATE TABLE users(id,name,age)');ex("INSERT INTO users VALUES(1,'Alice',30)");ex("INSERT INTO users VALUES(2,'Bob',25)");ex("INSERT INTO users VALUES(3,'Charlie',35)})();</script></body></html>
