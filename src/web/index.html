<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SQLite Web</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font:12px system-ui;background:#f5f5f5;padding:10px;max-width:600px;margin:0 auto}
    h1{color:#2563eb;margin-bottom:10px;font-size:18px}
    .ver{font-size:10px;color:#666;margin-bottom:10px}
    .ver a{color:#2563eb}
    textarea{width:100%;height:80px;font:11px monospace;padding:5px;border:1px solid #ddd;background:#fff;margin-bottom:5px;resize:vertical}
    button{padding:5px 10px;border:none;background:#2563eb;color:#fff;cursor:pointer;margin-right:5px;font:12px system-ui;border-radius:3px}
    button:hover{background:#1d4ed8}
    #out{padding:5px;background:#fff;border:1px solid #ddd;min-height:30px;margin-top:5px;font:11px monospace;border-radius:3px}
    .err{color:#ef4444}.ok{color:#10b981}
  </style>
</head>
<body>
  <h1>SQLite Web</h1>
  <div class="ver">
    <a href="minimal.html">⚡ Minimal</a> |
    <a href="index-turbo.html">Turbo</a> |
    <a href="index-fast.html">Fast</a> |
    <a href="index-full.html">Full</a>
  </div>
  <textarea id="sql" spellcheck="false">CREATE TABLE test(id INTEGER PRIMARY KEY, name TEXT);
INSERT INTO test VALUES(1, 'Alice');
INSERT INTO test VALUES(2, 'Bob');
SELECT * FROM test;</textarea>
  <div>
    <button onclick="run()">Execute</button>
    <button onclick="clr()">Clear</button>
  </div>
  <div id="out">Loading...</div>

  <script>
    let db, mod;

    async function init() {
      // Wait for SQLite module
      while (typeof createSQLiteModule === 'undefined') {
        await new Promise(r => setTimeout(r, 50));
      }

      mod = await createSQLiteModule();

      // Open in-memory database
      const pathPtr = mod._malloc(mod.lengthBytesUTF8(':memory:') + 1);
      mod.stringToUTF8(':memory:', pathPtr, mod.lengthBytesUTF8(':memory:') + 1);

      const dbPtrPtr = mod._malloc(4);
      const rc = mod._sqlite3_open(pathPtr, dbPtrPtr);

      if (rc !== 0) {
        document.getElementById('out').innerText = 'Error opening database';
        document.getElementById('out').className = 'err';
        return;
      }

      db = mod.HEAP32[dbPtrPtr >> 2];
      mod._free(pathPtr);
      mod._free(dbPtrPtr);

      document.getElementById('out').innerText = 'Ready';
    }

    function run() {
      const sql = document.getElementById('sql').value.trim();
      if (!sql) {
        document.getElementById('out').innerText = 'Enter SQL';
        document.getElementById('out').className = 'err';
        return;
      }

      const sqlLen = mod.lengthBytesUTF8(sql) + 1;
      const sqlPtr = mod._malloc(sqlLen);
      mod.stringToUTF8(sql, sqlPtr, sqlLen);

      const errPtr = mod._malloc(4);
      const rc = mod._sqlite3_exec(db, sqlPtr, 0, 0, errPtr);

      mod._free(sqlPtr);

      if (rc !== 0) {
        const errMsgPtr = mod.HEAP32[errPtr >> 2];
        const errMsg = errMsgPtr ? mod.UTF8ToString(errMsgPtr) : 'Error ' + rc;
        document.getElementById('out').innerText = errMsg;
        document.getElementById('out').className = 'err';
      } else {
        document.getElementById('out').innerText = '✓ Executed successfully';
        document.getElementById('out').className = 'ok';
      }

      mod._free(errPtr);
    }

    function clr() {
      document.getElementById('sql').value = '';
      document.getElementById('out').innerText = '';
    }

    // Start initialization
    init();
  </script>
</body>
</html>
