<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite B-Tree Visualization - Optimized</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Performance optimizations */
        #loading { display: none; }
        .loaded #loading { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SQLite B-Tree Visualization</h1>
            <p class="subtitle">Interactive WebAssembly-powered database internals explorer (Optimized Mode)</p>
        </header>

        <div class="main-layout">
            <div class="left-panel">
                <section class="sql-editor-section">
                    <h2>SQL Editor</h2>
                    <textarea id="sql-input" placeholder="Enter SQL commands here...">CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER);
INSERT INTO users VALUES (1, 'Alice', 30);
INSERT INTO users VALUES (2, 'Bob', 25);
SELECT * FROM users;</textarea>
                    <div class="button-group">
                        <button id="execute-btn" class="btn btn-primary">Execute SQL</button>
                        <button id="clear-btn" class="btn btn-secondary">Clear</button>
                    </div>
                </section>

                <section class="output-section">
                    <h2>Query Results</h2>
                    <div id="output" class="output-box">
                        <p class="placeholder">Results will appear here...</p>
                    </div>
                </section>

                <section class="events-section">
                    <h2>Event Log</h2>
                    <div class="controls">
                        <label>
                            <input type="checkbox" id="auto-scroll" checked>
                            Auto-scroll
                        </label>
                        <button id="clear-events-btn" class="btn btn-small">Clear Events</button>
                    </div>
                    <div id="event-log" class="event-log"></div>
                </section>
            </div>

            <div class="right-panel">
                <section class="visualization-section">
                    <h2>B-Tree Visualization</h2>
                    <div class="view-controls">
                        <button class="view-btn active" data-view="btree">B-Tree</button>
                        <button class="view-btn" data-view="parse">Parse Tree</button>
                        <button class="view-btn" data-view="vdbe">VDBE</button>
                    </div>
                    <div id="canvas-container">
                        <canvas id="visualization-canvas"></canvas>
                    </div>
                    <div id="node-info" class="node-info hidden">
                        <h3>Node Details</h3>
                        <div id="node-details"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Load WASM first -->
    <script src="build/sqlite3.js"></script>

    <!-- Use OPTIMIZED JavaScript files -->
    <script src="js/events-turbo.js"></script>
    <script src="js/visualizer-fast.js"></script>
    <script src="js/main-turbo.js"></script>
</body>
</html>
