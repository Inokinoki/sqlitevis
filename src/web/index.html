<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQLite Web</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font:12px system-ui;background:#f5f5f5;padding:10px;max-width:600px;margin:0 auto}
    h1{color:#2563eb;margin-bottom:5px;font-size:18px}
    .ver{font-size:10px;color:#666;margin-bottom:10px}
    .ver a{color:#2563eb;text-decoration:none}
    .ver a:hover{text-decoration:underline}
    textarea{width:100%;height:80px;font:11px monospace;padding:5px;border:1px solid #ddd;background:#fff;margin-bottom:5px;resize:vertical;border-radius:3px}
    button{padding:6px 12px;border:none;background:#2563eb;color:#fff;cursor:pointer;margin-right:5px;font:12px system-ui;border-radius:3px}
    button:hover{background:#1d4ed8}
    button:disabled{background:#ccc;cursor:not-allowed}
    #out{padding:5px;background:#fff;border:1px solid #ddd;min-height:30px;margin-top:5px;font:11px monospace;border-radius:3px}
    .err{color:#ef4444}.ok{color:#10b981}
    .load{color:#666;font-style:italic}
  </style>
</head>
<body>
  <h1>SQLite Web</h1>
  <div class="ver">
    <a href="minimal.html">⚡ Minimal</a> |
    <a href="index-turbo.html">Turbo</a> |
    <a href="index-fast.html">Fast</a> |
    <a href="index-full.html">Full</a>
  </div>
  <textarea id="sql" spellcheck="false" placeholder="Loading...">CREATE TABLE test(id INTEGER PRIMARY KEY, name TEXT);
INSERT INTO test VALUES(1, 'Alice');
INSERT INTO test VALUES(2, 'Bob');
SELECT * FROM test;</textarea>
  <div>
    <button id="runBtn" onclick="run()" disabled>Execute</button>
    <button onclick="clr()">Clear</button>
  </div>
  <div id="out" class="load">Loading SQLite module...</div>

  <script>
    // Register service worker for caching
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    let db, mod, ready = false;

    // Async load without blocking
    (function(){
      const s = document.createElement('script');
      s.src = 'build/sqlite3.js';
      s.async = true;
      s.onload = init;
      document.head.appendChild(s);
    })();

    async function init() {
      document.getElementById('out').textContent = 'Initializing...';

      // Small delay to let UI update
      await new Promise(r => setTimeout(r, 10));

      if (typeof createSQLiteModule === 'undefined') {
        document.getElementById('out').textContent = 'Error: SQLite module not found';
        document.getElementById('out').className = 'err';
        return;
      }

      try {
        mod = await createSQLiteModule();

        const p = mod._malloc(mod.lengthBytesUTF8(':memory:') + 1);
        mod.stringToUTF8(':memory:', p, mod.lengthBytesUTF8(':memory:') + 1);
        const pp = mod._malloc(4);

        if (mod._sqlite3_open(p, pp) !== 0) {
          throw new Error('Failed to open database');
        }

        db = mod.HEAP32[pp >> 2];
        mod._free(p);
        mod._free(pp);

        ready = true;
        document.getElementById('out').textContent = 'Ready';
        document.getElementById('out').className = 'ok';
        document.getElementById('runBtn').disabled = false;
        document.getElementById('sql').placeholder = 'Enter SQL here...';
      } catch(e) {
        document.getElementById('out').textContent = 'Error: ' + e.message;
        document.getElementById('out').className = 'err';
      }
    }

    function run() {
      if (!ready) {
        document.getElementById('out').textContent = 'Please wait...';
        document.getElementById('out').className = 'load';
        return;
      }

      const sql = document.getElementById('sql').value.trim();
      if (!sql) {
        document.getElementById('out').textContent = 'Enter SQL';
        document.getElementById('out').className = 'err';
        return;
      }

      try {
        const sp = mod._malloc(mod.lengthBytesUTF8(sql) + 1);
        mod.stringToUTF8(sql, sp, mod.lengthBytesUTF8(sql) + 1);
        const ep = mod._malloc(4);
        const rc = mod._sqlite3_exec(db, sp, 0, 0, ep);
        mod._free(sp);

        if (rc) {
          const em = mod.HEAP32[ep >> 2];
          document.getElementById('out').textContent = em ? mod.UTF8ToString(em) : 'Error ' + rc;
          document.getElementById('out').className = 'err';
        } else {
          document.getElementById('out').textContent = '✓ Executed successfully';
          document.getElementById('out').className = 'ok';
        }
        mod._free(ep);
      } catch(e) {
        document.getElementById('out').textContent = 'Error: ' + e.message;
        document.getElementById('out').className = 'err';
      }
    }

    function clr() {
      document.getElementById('sql').value = '';
      document.getElementById('out').textContent = '';
    }

    // Keyboard shortcut
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        run();
      }
    });
  </script>
</body>
</html>
