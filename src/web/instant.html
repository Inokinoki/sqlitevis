<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SQLite Instant</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font:12px system-ui;background:#f8f9fa;padding:10px;max-width:650px;margin:0 auto;line-height:1.4}
    h1{color:#2563eb;font-size:18px;margin-bottom:5px}
    .v{font-size:10px;color:#6c757d;margin-bottom:10px}
    .v a{color:#2563eb;text-decoration:none;margin-right:6px}
    textarea{width:100%;height:120px;font:12px monospace;padding:8px;border:1px solid #dee2e6;background:#fff;margin-bottom:8px;resize:vertical;border-radius:4px;font-family:'SF Mono',Monaco,monospace}
    .b{margin-bottom:8px}
    button{padding:7px 14px;border:none;background:#2563eb;color:#fff;cursor:pointer;margin-right:6px;font:12px system-ui;border-radius:4px;font-weight:500}
    button:hover{background:#1d4ed8}
    button.s{background:#e9ecef;color:#212529;font-weight:400}
    button.s:hover{background:#dee2e6}
    #o{background:#fff;border:1px solid #dee2e6;padding:10px;min-height:40px;margin-top:8px;border-radius:4px;font-size:11px}
    .e{color:#dc3545;background:#f8d7da;padding:10px;border-radius:4px;border:1px solid #f5c6cb}
    .ok{color:#198754;background:#d1e7dd;padding:10px;border-radius:4px;border:1px solid #badbcc}
    table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}
    th,td{padding:6px;text-align:left;border-bottom:1px solid #dee2e6}
    th{background:#f8f9fa;font-weight:600}
    tr:hover{background:#f8f9fa}
    .tip{background:#cfe2ff;border:1px solid #b6d4fe;padding:10px;border-radius:4px;margin-bottom:10px;font-size:11px}
  </style>
</head>
<body>
  <h1>SQLite Instant</h1>
  <div class="v"><a href="index.html">Standard (WASM 1.5MB)</a> | <a href="index-fast.html">Fast</a> | <a href="index-full.html">Full</a></div>

  <div class="tip">
    <strong>⚡ Instant Mode</strong> - Using pure JavaScript. No WebAssembly loading delay!
    <br>Basic SQL support: CREATE, INSERT, SELECT, DROP. Perfect for quick queries.
  </div>

  <textarea id="sql" spellcheck="false">CREATE TABLE users(id INTEGER PRIMARY KEY, name TEXT, age INTEGER);
INSERT INTO users VALUES(1, 'Alice', 30);
INSERT INTO users VALUES(2, 'Bob', 25);
INSERT INTO users VALUES(3, 'Charlie', 35);
SELECT * FROM users;</textarea>

  <div class="b">
    <button onclick="run()">Run SQL (Ctrl+Enter)</button>
    <button class="s" onclick="clr()">Clear</button>
    <button class="s" onclick="ex()">Example</button>
  </div>

  <div id="o"></div>

  <script>
    // Pure JavaScript SQL Engine - Instant Load!
    class SQL {
      constructor() {
        this.tables = {};
        this.results = [];
        this.lastError = null;
      }

      execute(sql) {
        this.results = [];
        this.lastError = null;

        const statements = sql.split(';').map(s => s.trim()).filter(s => s);
        let output = [];

        for (const stmt of statements) {
          if (!stmt) continue;

          try {
            const upper = stmt.toUpperCase();

            if (upper.startsWith('CREATE TABLE')) {
              this.createTable(stmt);
              output.push('✓ Table created');
            }
            else if (upper.startsWith('DROP TABLE')) {
              this.dropTable(stmt);
              output.push('✓ Table dropped');
            }
            else if (upper.startsWith('INSERT')) {
              this.insert(stmt);
              output.push('✓ Row inserted');
            }
            else if (upper.startsWith('SELECT')) {
              this.select(stmt);
              if (this.results.length > 0) {
                return { success: true, results: this.results, message: '✓ Query returned ' + this.results.length + ' rows' };
              }
              output.push('✓ Query completed (no results)');
            }
            else {
              throw new Error('Unsupported statement: ' + stmt.split(' ')[0]);
            }
          } catch (e) {
            return { success: false, error: e.message };
          }
        }

        return { success: true, message: output.join('\n') };
      }

      createTable(stmt) {
        const match = stmt.match(/CREATE\s+TABLE\s+(\w+)\s*\((.*)\)/i);
        if (!match) throw new Error('Invalid CREATE TABLE syntax');

        const [, name, defs] = match;
        const columns = defs.split(',').map(d => {
          const parts = d.trim().split(/\s+/);
          return { name: parts[0], type: parts[1] || 'TEXT' };
        });

        this.tables[name] = { columns, rows: [] };
      }

      dropTable(stmt) {
        const match = stmt.match(/DROP\s+TABLE\s+(\w+)/i);
        if (!match) throw new Error('Invalid DROP TABLE syntax');

        const name = match[1];
        if (!this.tables[name]) throw new Error('Table not found: ' + name);

        delete this.tables[name];
      }

      insert(stmt) {
        const match = stmt.match(/INSERT\s+INTO\s+(\w+)\s+VALUES\s*\((.*)\)/i);
        if (!match) throw new Error('Invalid INSERT syntax');

        const [, name, values] = match;
        const table = this.tables[name];
        if (!table) throw new Error('Table not found: ' + name);

        const vals = values.split(',').map(v => {
          v = v.trim();
          if (v === 'NULL') return null;
          if (v.startsWith("'") && v.endsWith("'")) return v.slice(1, -1);
          return isNaN(v) ? v : Number(v);
        });

        table.rows.push(vals);
      }

      select(stmt) {
        const match = stmt.match(/SELECT\s+(.+)\s+FROM\s+(\w+)/i);
        if (!match) throw new Error('Invalid SELECT syntax');

        const [, cols, name] = match;
        const table = this.tables[name];
        if (!table) throw new Error('Table not found: ' + name);

        const selectAll = cols.trim() === '*';
        const colIndices = selectAll
          ? table.columns.map((_, i) => i)
          : cols.split(',').map(c => {
            const idx = table.columns.findIndex(col => col.name.toLowerCase() === c.trim().toLowerCase());
            if (idx === -1) throw new Error('Column not found: ' + c);
            return idx;
          });

        this.results = table.rows.map(row => colIndices.map(i => row[i]));
      }
    }

    // Initialize SQL engine instantly
    const sql = new SQL();

    function run() {
      const input = document.getElementById('sql').value.trim();
      if (!input) {
        showError('Please enter SQL');
        return;
      }

      const result = sql.execute(input);

      if (result.success) {
        if (result.results && result.results.length > 0) {
          showResults(result.results, result.message);
        } else {
          showSuccess(result.message);
        }
      } else {
        showError(result.error);
      }
    }

    function showResults(results, message) {
      let html = '<div class="ok">' + message + '</div>';
      html += '<table><thead><tr>';

      const cols = results[0].length;
      for (let i = 0; i < cols; i++) {
        html += '<th>Column ' + (i + 1) + '</th>';
      }
      html += '</tr></thead><tbody>';

      results.forEach(row => {
        html += '<tr>';
        row.forEach(cell => {
          const val = cell === null ? '<em>NULL</em>' : escape(String(cell));
          html += '<td>' + val + '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('o').innerHTML = html;
    }

    function showSuccess(msg) {
      document.getElementById('o').innerHTML = '<div class="ok">' + msg + '</div>';
    }

    function showError(msg) {
      document.getElementById('o').innerHTML = '<div class="e">⚠ Error: ' + escape(msg) + '</div>';
    }

    function escape(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function clr() {
      document.getElementById('sql').value = '';
      document.getElementById('o').innerHTML = '';
    }

    function ex() {
      document.getElementById('sql').value = `CREATE TABLE users(id INTEGER PRIMARY KEY, name TEXT, age INTEGER);
INSERT INTO users VALUES(1, 'Alice', 30);
INSERT INTO users VALUES(2, 'Bob', 25);
INSERT INTO users VALUES(3, 'Charlie', 35);
INSERT INTO users VALUES(4, 'Diana', 28);
SELECT * FROM users;`;
      document.getElementById('o').innerHTML = '<div style="color:#6c757d;padding:10px">Example loaded - click Run SQL</div>';
    }

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        run();
      }
    });
  </script>
</body>
</html>
