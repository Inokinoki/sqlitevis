<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event System Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .test { margin: 20px 0; padding: 15px; background: #252526; border: 1px solid #3e3e42; }
        .pass { color: #4ec9b0; }
        .fail { color: #f48771; }
        .info { color: #569cd6; }
        pre { background: #1e1e1e; padding: 10px; }
        button { background: #0e639c; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>SQLite Event System Test</h1>

    <div class="test">
        <h2>Test 1: VDBE Events</h2>
        <button onclick="testVdbe()">Run Test</button>
        <pre id="vdbe-result">Ready</pre>
    </div>

    <div class="test">
        <h2>Test 2: SQL Parsing Events</h2>
        <button onclick="testParsing()">Run Test</button>
        <pre id="parse-result">Ready</pre>
    </div>

    <div class="test">
        <h2>Test 3: B-Tree Page Events</h2>
        <button onclick="testBtree()">Run Test</button>
        <pre id="btree-result">Ready</pre>
    </div>

    <div class="test">
        <h2>Full Integration Test</h2>
        <button onclick="testFull()">Run Test</button>
        <pre id="full-result">Ready</pre>
    </div>

    <div class="test">
        <h2>Event Log</h2>
        <button onclick="clearLog()">Clear</button>
        <pre id="log" style="max-height: 300px; overflow-y: auto;"></pre>
    </div>

    <script src="js/sqlite3.js"></script>
    <script>
        const events = {
            VDBE_START: 0,
            VDBE_OPCODE: 0,
            VDBE_COMPLETE: 0,
            PARSE_START: 0,
            PARSE_TOKEN: 0,
            PARSE_COMPLETE: 0,
            BTREE_OPEN: 0,
            BTREE_INSERT: 0,
            BTREE_DELETE: 0,
            PAGE_ALLOCATE: 0,
            PAGE_FREE: 0
        };

        const logData = [];

        function log(msg) {
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            const entry = `[${timestamp}] ${msg}`;
            logData.push(entry);
            document.getElementById('log').textContent = logData.join('\n');
        }

        function clearLog() {
            logData.length = 0;
            document.getElementById('log').textContent = '';
        }

        // Event handlers
        window.sqliteVisEventHandler = (eventType, eventData) => {
            const typeName = [
                'BTREE_OPEN', 'BTREE_CLOSE', 'BTREE_INSERT', 'BTREE_DELETE',
                'BTREE_SPLIT', 'BTREE_BALANCE', 'PAGE_ALLOCATE', 'PAGE_FREE',
                'PARSE_START', 'PARSE_TOKEN', 'PARSE_COMPLETE',
                'VDBE_START', 'VDBE_OPCODE', 'VDBE_COMPLETE'
            ][eventType] || 'UNKNOWN';

            if (events[typeName] !== undefined) {
                events[typeName]++;
            }

            log(`${typeName}: ${eventData}`);
        };

        async function initDB() {
            if (window.sqliteModule) return window.sqliteModule;

            const Module = await createSQLiteModule({
                locateFile: (file) => '../build/' + file,
                print: (text) => log('[SQLite] ' + text),
                printErr: (text) => log('[SQLite Error] ' + text)
            });

            window.sqliteModule = Module;
            return Module;
        }

        function execSQL(Module, db, sql) {
            const sqlPtr = Module._malloc(Module.lengthBytesUTF8(sql) + 1);
            Module.stringToUTF8(sql, sqlPtr, Module.lengthBytesUTF8(sql) + 1);

            const result = Module._sqlite3_exec(db, sqlPtr, 0, 0, 0);
            Module._free(sqlPtr);

            if (result !== 0) {
                throw new Error('SQLite error: ' + result);
            }
        }

        async function testVdbe() {
            const el = document.getElementById('vdbe-result');
            try {
                Object.keys(events).forEach(k => events[k] = 0);
                clearLog();

                const Module = await initDB();
                const dbPtrPtr = Module._malloc(4);
                Module._sqlite3_open(':memory:', dbPtrPtr);
                const db = Module.HEAP32[dbPtrPtr >> 2];

                log('Testing VDBE Events...');
                log('Executing: SELECT 1');

                execSQL(Module, db, 'SELECT 1');

                const vdbeStart = events.VDBE_START > 0;
                const vdbeOpcode = events.VDBE_OPCODE > 0;
                const vdbeComplete = events.VDBE_COMPLETE > 0;

                el.innerHTML = `
                    <span class="${vdbeStart ? 'pass' : 'fail'}">
                        VDBE_START: ${events.VDBE_START} ${vdbeStart ? '✓' : '✗'}
                    </span>
                    <span class="${vdbeOpcode ? 'pass' : 'fail'}">
                        VDBE_OPCODE: ${events.VDBE_OPCODE} ${vdbeOpcode ? '✓' : '✗'}
                    </span>
                    <span class="${vdbeComplete ? 'pass' : 'fail'}">
                        VDBE_COMPLETE: ${events.VDBE_COMPLETE} ${vdbeComplete ? '✓' : '✗'}
                    </span>
                `;

                Module._free(dbPtrPtr);
            } catch (e) {
                el.innerHTML = `<span class="fail">Error: ${e.message}</span>`;
                log('Error: ' + e.message);
            }
        }

        async function testParsing() {
            const el = document.getElementById('parse-result');
            try {
                Object.keys(events).forEach(k => events[k] = 0);
                clearLog();

                const Module = await initDB();
                const dbPtrPtr = Module._malloc(4);
                Module._sqlite3_open(':memory:', dbPtrPtr);
                const db = Module.HEAP32[dbPtrPtr >> 2];

                log('Testing Parse Events...');
                log('Executing: CREATE TABLE test (id INTEGER, name TEXT)');

                execSQL(Module, db, 'CREATE TABLE test (id INTEGER, name TEXT)');

                const parseStart = events.PARSE_START > 0;
                const parseToken = events.PARSE_TOKEN > 0;
                const parseComplete = events.PARSE_COMPLETE > 0;

                el.innerHTML = `
                    <span class="${parseStart ? 'pass' : 'fail'}">
                        PARSE_START: ${events.PARSE_START} ${parseStart ? '✓' : '✗'}
                    </span>
                    <span class="${parseToken ? 'pass' : 'fail'}">
                        PARSE_TOKEN: ${events.PARSE_TOKEN} ${parseToken ? '✓' : '✗'}
                    </span>
                    <span class="${parseComplete ? 'pass' : 'fail'}">
                        PARSE_COMPLETE: ${events.PARSE_COMPLETE} ${parseComplete ? '✓' : '✗'}
                    </span>
                `;

                Module._free(dbPtrPtr);
            } catch (e) {
                el.innerHTML = `<span class="fail">Error: ${e.message}</span>`;
                log('Error: ' + e.message);
            }
        }

        async function testBtree() {
            const el = document.getElementById('btree-result');
            try {
                Object.keys(events).forEach(k => events[k] = 0);
                clearLog();

                const Module = await initDB();
                const dbPtrPtr = Module._malloc(4);
                Module._sqlite3_open(':memory:', dbPtrPtr);
                const db = Module.HEAP32[dbPtrPtr >> 2];

                log('Testing B-Tree Events...');
                log('Executing: CREATE TABLE test (id INTEGER)');
                execSQL(Module, db, 'CREATE TABLE test (id INTEGER)');

                log('Executing: INSERT INTO test VALUES (1)');
                execSQL(Module, db, 'INSERT INTO test VALUES (1)');

                log('Executing: INSERT INTO test VALUES (2)');
                execSQL(Module, db, 'INSERT INTO test VALUES (2)');

                const btreeOpen = events.BTREE_OPEN > 0;
                const pageAlloc = events.PAGE_ALLOCATE > 0;
                const btreeInsert = events.BTREE_INSERT > 0;

                el.innerHTML = `
                    <span class="${btreeOpen ? 'pass' : 'fail'}">
                        BTREE_OPEN: ${events.BTREE_OPEN} ${btreeOpen ? '✓' : '✗'}
                    </span>
                    <span class="${pageAlloc ? 'pass' : 'fail'}">
                        PAGE_ALLOCATE: ${events.PAGE_ALLOCATE} ${pageAlloc ? '✓' : '✗'}
                    </span>
                    <span class="${btreeInsert ? 'pass' : 'fail'}">
                        BTREE_INSERT: ${events.BTREE_INSERT} ${btreeInsert ? '✓' : '✗'}
                    </span>
                `;

                Module._free(dbPtrPtr);
            } catch (e) {
                el.innerHTML = `<span class="fail">Error: ${e.message}</span>`;
                log('Error: ' + e.message);
            }
        }

        async function testFull() {
            const el = document.getElementById('full-result');
            try {
                Object.keys(events).forEach(k => events[k] = 0);
                clearLog();

                const Module = await initDB();
                const dbPtrPtr = Module._malloc(4);
                Module._sqlite3_open(':memory:', dbPtrPtr);
                const db = Module.HEAP32[dbPtrPtr >> 2];

                log('Full Integration Test...');
                log('Creating table...');
                execSQL(Module, db, 'CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, email TEXT)');

                log('Inserting data...');
                execSQL(Module, db, 'INSERT INTO users VALUES (1, "Alice", "alice@example.com")');
                execSQL(Module, db, 'INSERT INTO users VALUES (2, "Bob", "bob@example.com")');
                execSQL(Module, db, 'INSERT INTO users VALUES (3, "Charlie", "charlie@example.com")');

                log('Querying data...');
                execSQL(Module, db, 'SELECT * FROM users WHERE id = 2');

                const vdbeOk = events.VDBE_START > 0 && events.VDBE_OPCODE > 0;
                const parseOk = events.PARSE_START > 0 && events.PARSE_TOKEN > 0;
                const btreeOk = events.PAGE_ALLOCATE > 0 || events.BTREE_INSERT > 0;

                el.innerHTML = `
                    <span class="${vdbeOk ? 'pass' : 'fail'}">
                        VDBE: ${events.VDBE_START} start, ${events.VDBE_OPCODE} opcodes ${vdbeOk ? '✓' : '✗'}
                    </span><br>
                    <span class="${parseOk ? 'pass' : 'fail'}">
                        Parse: ${events.PARSE_START} start, ${events.PARSE_TOKEN} tokens ${parseOk ? '✓' : '✗'}
                    </span><br>
                    <span class="${btreeOk ? 'pass' : 'fail'}">
                        B-Tree: ${events.PAGE_ALLOCATE} alloc, ${events.BTREE_INSERT} insert ${btreeOk ? '✓' : '✗'}
                    </span>
                `;

                Module._free(dbPtrPtr);
            } catch (e) {
                el.innerHTML = `<span class="fail">Error: ${e.message}</span>`;
                log('Error: ' + e.message);
            }
        }

        window.addEventListener('load', () => {
            log('Page loaded. Click a button to start testing.');
        });
    </script>
</body>
</html>
